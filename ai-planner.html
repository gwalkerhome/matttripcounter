<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI Planner</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-home text-white">

    <div class="w-full flex justify-between items-center pt-10 mb-4">
        <h1 class="text-2xl font-black">AI Planner</h1>
        <a href="plan.html" class="text-xs font-bold uppercase opacity-50">Close</a>
    </div>

    <div id="ai-response-area" class="flex-grow w-full overflow-y-auto p-4 space-y-4">
        <div class="bg-white/10 p-5 rounded-2xl rounded-tl-none max-w-[85%] border border-white/10">
            <p class="text-sm">Hola Matt! I have access to your trip history. Tell me what dates you're thinking of, and I'll check the 90/180 rule for you.</p>
        </div>
        <div id="ai-typing" class="hidden italic text-xs opacity-50 px-2 animate-pulse">Gemini is calculating...</div>
    </div>

    <div class="w-full pb-8 pt-4">
        <div class="relative flex items-center">
            <input id="ai-input" type="text" placeholder="e.g. Can I go for 2 weeks in August?" 
                   class="w-full py-5 px-6 bg-black/40 border border-white/20 rounded-3xl text-white placeholder-white/30 focus:outline-none focus:border-orange-500">
            <button onclick="askAI()" class="absolute right-3 p-3 bg-orange-500 rounded-full shadow-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
    <script>
        async function askAI() {
            const input = document.getElementById('ai-input');
            const area = document.getElementById('ai-response-area');
            const typing = document.getElementById('ai-typing');
            
            if (!input.value) return;

            // 1. Add Matt's question to screen
            const userMsg = document.createElement('div');
            userMsg.className = "bg-orange-500/20 p-4 rounded-2xl rounded-tr-none max-w-[85%] ml-auto border border-orange-500/30";
            userMsg.innerHTML = `<p class="text-sm">${input.value}</p>`;
            area.appendChild(userMsg);
            
            const prompt = input.value;
            input.value = '';
            typing.classList.remove('hidden');
            area.scrollTop = area.scrollHeight;

            // 2. Here we will plug in the Gemini API call in the next step
            // For the draft, let's simulate a response
            setTimeout(() => {
                typing.classList.add('hidden');
                const aiMsg = document.createElement('div');
                aiMsg.className = "bg-white/10 p-5 rounded-2xl rounded-tl-none max-w-[85%] border border-white/10";
                aiMsg.innerHTML = `<p class="text-sm italic">Simulated: I've checked your ${window.tripCount || 0} trips. Looking at August, you will have 42 days available. Would you like me to log that?</p>`;
                area.appendChild(aiMsg);
                area.scrollTop = area.scrollHeight;
            }, 1500);
        }
    </script>
</body>
</html>
