<style>
    /* 1. Fully Transparent Scrolling Window */
    #history-window {
        background: transparent; /* Removed the frost */
        width: 100vw; /* Full viewport width */
        margin-left: calc(-50vw + 50%); /* Centers the full-width element */
        max-height: 55vh; 
        overflow-y: auto;
        padding: 0 1.5rem; /* Keeps the text from hitting the edges */
        -webkit-overflow-scrolling: touch;
    }

    /* 2. Cleaner Rows for Transparency */
    .trip-row {
        background: rgba(255, 255, 255, 0.05); /* Very subtle hint of a row */
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding: 1.25rem 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    /* Hide scrollbar for a cleaner look */
    #history-window::-webkit-scrollbar { display: none; }
</style>

<div class="w-full max-w-md">
    <h2 class="text-lg font-bold mb-4 px-6 opacity-80" style="text-shadow: 0 2px 5px rgba(0,0,0,0.5);">Saved Trips</h2>
    
    <div id="history-window">
        <div id="trip-list">
            <p class="text-center opacity-50 italic py-10">Loading history...</p>
        </div>
    </div>
</div>
