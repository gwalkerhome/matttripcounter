<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Trip Log - Spain Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        .flatpickr-calendar { background: rgba(0,0,0,0.95) !important; border: 1px solid rgba(255,255,255,0.2) !important; }
        .flatpickr-day.selected { background: #fb923c !important; border-color: #fb923c !important; }
        .hidden-section { display: none; }
    </style>
</head>
<body class="bg-home min-h-screen flex flex-col items-center p-6 text-white">

    <div class="w-full max-w-md flex justify-between items-center mb-8 mt-4">
        <h1 class="text-3xl font-black tracking-tight" style="text-shadow: 0 4px 10px rgba(0,0,0,0.5);">Trip Log</h1>
        <a href="index.html" class="glass-button px-6 py-2 text-sm font-bold">Done</a>
    </div>

    <div id="initial-actions" class="w-full max-w-md mb-6">
        <button onclick="showCalendar()" class="w-full py-5 glass-button font-black text-lg tracking-wide uppercase shadow-2xl">
            + Log a New Trip
        </button>
    </div>

    <div id="calendar-section" class="hidden-section w-full max-w-md mb-10 animate-in fade-in duration-500">
        <div class="glass-button p-4">
            <p class="text-xs uppercase tracking-widest font-bold opacity-70 mb-3 text-center">Select Dates Below</p>
            
            <input type="text" id="range-picker" class="w-full p-4 rounded-xl text-black font-bold text-center mb-4 bg-white" placeholder="Tap to open calendar">
            
            <div class="flex gap-2">
                <button onclick="hideCalendar()" class="w-1/3 py-4 bg-white/10 text-white font-bold rounded-xl border border-white/20">Cancel</button>
                <button onclick="saveTrip()" id="add-btn" class="w-2/3 py-4 bg-green-500 text-white font-black rounded-xl shadow-lg transition-all opacity-30 cursor-not-allowed" disabled>
                    SAVE TRIP
                </button>
            </div>
        </div>
    </div>

    <div class="w-full max-w-md">
        <h2 class="text-lg font-bold mb-4 px-2" style="text-shadow: 0 2px 5px rgba(0,0,0,0.5);">Saved Trips</h2>
        <div id="trip-list" class="space-y-3 pb-20">
            <p class="text-center opacity-50 italic py-10">Loading your history...</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB5l2JrkNaHqpg3KBCwyDW3UTBlv1QSrZo",
            authDomain: "matttrip-56a17.firebaseapp.com",
            projectId: "matttrip-56a17",
            databaseURL: "https://matttrip-56a17-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let selectedDates = [];

        const fp = flatpickr("#range-picker", {
            mode: "range",
            dateFormat: "d/m/Y",
            monthSelectorType: "static",
            closeOnSelect: false,
            inline: true, // This makes the calendar always visible when the section is shown
            onChange: function(dates) {
                selectedDates = dates;
                const btn = document.getElementById('add-btn');
                if (dates.length === 2) {
                    btn.disabled = false;
                    btn.classList.remove('opacity-30', 'cursor-not-allowed');
                } else {
                    btn.disabled = true;
                    btn.classList.add('opacity-30', 'cursor-not-allowed');
                }
            }
        });

        function showCalendar() {
            document.getElementById('initial-actions').classList.add('hidden-section');
            document.getElementById('calendar-section').classList.remove('hidden-section');
            fp.redraw(); 
        }

        function hideCalendar() {
            document.getElementById('calendar-section').classList.add('hidden-section');
            document.getElementById('initial-actions').classList.remove('hidden-section');
            fp.clear();
        }

        function loadTrips() {
            db.ref('trips').on('value', (snapshot) => {
                const tripList = document.getElementById('trip-list');
                tripList.innerHTML = '';
                if (!snapshot.exists()) {
                    tripList.innerHTML = '<p class="text-center opacity-50 py-10">No trips recorded.</p>';
                    return;
                }

                let data = [];
                snapshot.forEach(child => { data.push({ key: child.key, ...child.val() }); });
                data.sort((a, b) => new Date(b.entry) - new Date(a.entry));

                data.forEach(trip => {
                    const div = document.createElement('div');
                    div.className = 'trip-item p-5 flex justify-between items-center shadow-lg bg-white/10 rounded-2xl mb-3';
                    
                    div.innerHTML = `
                        <div>
                            <div class="font-bold text-base text-white">${formatDateDisplay(trip.entry)} — ${formatDateDisplay(trip.exit)}</div>
                            <div class="text-xs text-orange-400 font-bold uppercase tracking-tighter mt-1">${calculateDays(trip.entry, trip.exit)} Day Stay</div>
                        </div>
                        <button onclick="deleteTrip('${trip.key}')" class="bg-red-500/10 p-3 rounded-xl text-red-400 text-xs font-bold border border-red-500/20">Delete</button>
                    `;
                    tripList.appendChild(div);
                });
            });
        }

        function formatDateDisplay(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-GB');
        }

        function calculateDays(start, end) {
            const d1 = new Date(start);
            const d2 = new Date(end);
            return Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
        }

        function saveTrip() {
            if (selectedDates.length === 2) {
                const entry = formatDateStorage(selectedDates[0]);
                const exit = formatDateStorage(selectedDates[1]);
                db.ref('trips').push({ entry, exit });
                hideCalendar();
            }
        }

        function formatDateStorage(date) {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1);
            let day = '' + d.getDate();
            let year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        }

        function deleteTrip(key) {
            if(confirm("Delete this trip entry?")) { db.ref('trips').child(key).remove(); }
        }

        window.onload = loadTrips;
    </script>
</body>
</html>
