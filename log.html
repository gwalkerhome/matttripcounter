<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">
    <title>Matt's Trips</title>
    <link rel="apple-touch-icon" href="assets/icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .trip-card {
            width: 100%;
            max-width: 300px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 14px;
            border: 2.5px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.35);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            margin-bottom: 8px;
        }

        .trip-card.past    { border-color: rgba(255,255,255,0.15); }
        .trip-card.current { border-color: #2ED573; box-shadow: 0 0 12px rgba(46,213,115,0.4); }
        .trip-card.future  { border-color: #00A8FF; box-shadow: 0 0 12px rgba(0,168,255,0.3); }

        .trip-scroll {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 12px 20px 20px;
            height: 100%;
        }
        .trip-scroll::-webkit-scrollbar { display: none; }

        .bottom-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 55%;
            background: rgba(0,0,0,0.55);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border-top: 2px solid rgba(255,255,255,0.12);
            border-radius: 28px 28px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 16px 20px 8px;
            flex-shrink: 0;
        }

        .badge {
            display: inline-block;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 2px 7px;
            border-radius: 6px;
        }
        .badge-past    { background: rgba(255,255,255,0.15); color: #fff; }
        .badge-current { background: #2ED573; color: #000; }
        .badge-future  { background: #00A8FF; color: #fff; }
    </style>
</head>

<body>
    <div id="bg-layer"></div>

    <div id="ui-layer">

        <!-- NAV BUTTONS -->
        <a class="nav-btn nav-back" onclick="history.back()">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <a class="nav-btn nav-home" href="index.html">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>

        <!-- TOP HALF: Title + Status -->
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 45%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px; text-align: center;">
            <h1 class="text-brutal" style="font-size: 2.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; margin: 0 0 10px;">Matt's Trips</h1>
            <p id="status-line" class="text-brutal" style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.85; margin: 0 0 20px;">Loading...</p>
            <div style="display: flex; gap: 12px;">
                <a href="add-trip.html" class="brutalist-btn btn-half bg-blue">Log a past trip</a>
                <a href="plan.html" class="brutalist-btn btn-half bg-pink">Plan a future trip</a>
            </div>
        </div>

        <!-- BOTTOM HALF: Trip list panel -->
        <div class="bottom-panel">
            <div class="panel-header">
                <span class="text-brutal" style="font-size: 0.65rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.15em; opacity: 0.5;">Trip History</span>
            </div>
            <div class="trip-scroll" id="trip-list">
                <!-- Injected by JS -->
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="schengen-engine.js"></script>
    <script src="app.js"></script>

    <script>
        function toUK(dateStr) {
            if (!dateStr) return "";
            const [y, m, d] = dateStr.split('-');
            return `${d}.${m}.${y}`;
        }

        function daysBetween(a, b) {
            return Math.round((b - a) / (1000 * 60 * 60 * 24));
        }

        function renderStatusLine(trips, todayStr) {
            const today = new Date(`${todayStr}T12:00:00`);
            const sorted = [...trips].sort((a, b) => new Date(a.entry) - new Date(b.entry));

            const currentTrip = sorted.find(t => todayStr >= t.entry && todayStr <= t.exit);
            const nextSpain = sorted.find(t => t.entry > todayStr);
            const lastTrip = [...sorted].reverse().find(t => t.exit < todayStr);

            const el = document.getElementById('status-line');
            if (!el) return;

            if (currentTrip) {
                const exitDate = new Date(`${currentTrip.exit}T12:00:00`);
                const days = daysBetween(today, exitDate);
                if (days === 0) el.innerText = "You return to England today!";
                else el.innerText = `${days} day${days !== 1 ? 's' : ''} until you return to England`;
            } else if (nextSpain) {
                const entryDate = new Date(`${nextSpain.entry}T12:00:00`);
                const days = daysBetween(today, entryDate);
                if (days === 0) el.innerText = "You head to Spain today!";
                else el.innerText = `${days} day${days !== 1 ? 's' : ''} until you next go to Spain`;
            } else {
                el.innerText = "You have no future trips logged";
            }
        }

        function renderTripList(trips, todayStr) {
            const list = document.getElementById('trip-list');
            if (!list) return;
            list.innerHTML = '';

            if (!trips || trips.length === 0) {
                list.innerHTML = '<p style="color:rgba(255,255,255,0.3); font-size:0.7rem; font-weight:900; text-transform:uppercase; letter-spacing:0.15em; margin-top:24px;">No trips logged yet</p>';
                return;
            }

            const sorted = [...trips].sort((a, b) => new Date(b.entry) - new Date(a.entry));

            sorted.forEach(t => {
                let status = 'past';
                let label = 'Past';
                if (todayStr >= t.entry && todayStr <= t.exit) { status = 'current'; label = 'Now'; }
                else if (t.entry > todayStr) { status = 'future'; label = 'Upcoming'; }

                const entryDate = new Date(`${t.entry}T12:00:00`);
                const exitDate = new Date(`${t.exit}T12:00:00`);
                const nights = daysBetween(entryDate, exitDate);

                const card = document.createElement('div');
                card.className = `trip-card ${status}`;
                card.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:4px;">
                        <span class="badge badge-${status}">${label}</span>
                        <span style="color:#fff; font-weight:900; font-size:0.85rem; letter-spacing:-0.01em;">${toUK(t.entry)} — ${toUK(t.exit)}</span>
                        <span style="color:rgba(255,255,255,0.45); font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em;">${nights} night${nights !== 1 ? 's' : ''}</span>
                    </div>
                    <button onclick="deleteTrip('${t.id}')" style="background:none; border:none; color:rgba(255,80,80,0.7); font-size:0.65rem; font-weight:900; text-transform:uppercase; letter-spacing:0.05em; cursor:pointer; padding:4px;">Delete</button>
                `;
                list.appendChild(card);
            });
        }

        function deleteTrip(tripId) {
            if (!tripId || tripId === 'undefined') return;
            if (confirm("Permanently delete this trip?")) {
                window.db.ref('trips').child(tripId).remove();
            }
        }

        window.addEventListener('tripsUpdated', () => {
            const now = new Date();
            const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            renderStatusLine(window.allTrips, todayStr);
            renderTripList(window.allTrips, todayStr);
        });
    </script>
</body>
</html>
