<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">
    <title>Trip Log</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #history-window {
            background: transparent;
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            max-height: 60vh; 
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        #history-window::-webkit-scrollbar { display: none; }
        .trip-row {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body id="main-body" class="min-h-screen text-white bg-black">

    <div class="px-6">
        <div class="w-full max-w-md flex justify-between items-center mb-8 mt-6">
            <h1 class="text-3xl font-black italic tracking-tighter">TRIP LOG</h1>
            <a href="index.html" class="glass-button px-5 py-2 text-[10px] font-black uppercase tracking-widest">Done</a>
        </div>

        <div class="w-full max-w-md mb-10">
            <a href="add-trip.html" class="block w-full py-5 bg-white text-black font-black text-center uppercase tracking-widest rounded-[2rem] shadow-xl active:scale-95 transition-transform">
                + Add New Trip
            </a>
        </div>

        <div class="w-full max-w-md">
            <h2 class="text-[10px] font-black mb-4 opacity-40 uppercase tracking-[0.2em]">Saved History</h2>
            <div id="history-window">
                <div id="trip-list"></div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <!-- Master Logic (Handles Initialization) -->
    <script src="schengen-engine.js"></script> 
    <script src="app.js"></script>

    <script>
        function toUK(dateStr) {
            if (!dateStr) return "";
            const [y, m, d] = dateStr.split('-');
            return `${d}-${m}-${y}`;
        }

        function renderTripList() {
            const list = document.getElementById('trip-list');
            if (!window.allTrips) return;

            list.innerHTML = '';

            if (window.allTrips.length === 0) { 
                list.innerHTML = '<p class="text-center opacity-30 py-20 italic text-sm">No trips recorded yet.</p>'; 
                return; 
            }

            // Create a local copy to sort without affecting the global array
            let data = [...window.allTrips];
            data.sort((a,b) => new Date(b.entry) - new Date(a.entry));

            data.forEach(t => {
                const div = document.createElement('div');
                div.className = 'trip-row';
                // We use the unique key from Firebase if available, otherwise fallback
                const tripId = t.id || Object.keys(window.allTrips).find(key => window.allTrips[key] === t);
                
                div.innerHTML = `
                    <div>
                        <div class="text-[9px] opacity-40 font-black uppercase tracking-widest mb-1">Dates</div>
                        <div class="font-bold text-sm tracking-tight">
                            ${toUK(t.entry)} <span class="opacity-30 mx-1">—</span> ${toUK(t.exit)}
                        </div>
                    </div>
                    <button onclick="deleteTrip('${t.id}')" class="text-red-400 text-[10px] font-black uppercase tracking-tighter px-4 py-2 bg-red-500/10 rounded-full border border-red-500/20 active:bg-red-500/30 transition-colors">
                        Delete
                    </button>
                `;
                list.appendChild(div);
            });
        }

        function deleteTrip(tripId) { 
            if(!tripId || tripId === 'undefined') {
                alert("Error: Trip ID missing. Try refreshing.");
                return;
            }
            if(confirm("Permanently delete this trip?")) {
                window.db.ref('trips').child(tripId).remove(); 
            }
        }

        // FIX: React to the master data update
        window.addEventListener('tripsUpdated', renderTripList);
    </script>
</body>
</html>
