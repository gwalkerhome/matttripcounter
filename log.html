<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">
    <title>Trip History</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
            margin: 0;
            padding: 0;
            background-color: #000;
        }

        /* Standardized list styling to ensure it looks 'Brutal' */
        .trip-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-left: 4px solid #2ED573; /* Green for completed trips */
            margin-bottom: 12px;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .trip-card.future {
            border-left-color: #FF4DFF; /* Pink for planned trips */
        }
    </style>
</head>

<body id="main-body">

    <div id="bg-layer"></div>

    <div id="app-shell">
        
        <a class="nav-btn nav-back" onclick="history.back()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>
        <a class="nav-btn nav-home" href="index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>

        <div class="h-[40%] flex flex-col items-center justify-center px-8 text-center pt-10">
            <h1 class="text-white text-5xl font-black uppercase tracking-tighter" 
                style="filter: drop-shadow(4px 4px 0px #000); -webkit-text-stroke: 1.5px #000;">
                History
            </h1>
            <p id="status-line" class="text-white text-[10px] font-black uppercase tracking-[0.3em] mt-4 opacity-70">
                Loading database...
            </p>
        </div>

        <div class="relative flex-grow bg-black/60 backdrop-blur-2xl border-t-2 border-white/10 rounded-t-[40px] flex flex-col overflow-hidden shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
            
            <div class="p-6 pb-2 flex justify-between items-end">
                <span class="text-white text-[11px] font-black uppercase tracking-widest opacity-40">Previous Trips</span>
                <span id="trip-count" class="text-pink-500 text-[11px] font-black">0 TOTAL</span>
            </div>

            <div id="trip-list" class="flex-grow overflow-y-auto px-6 pb-20 space-y-3">
                </div>

            <div class="absolute bottom-0 left-0 right-0 h-16 bg-gradient-to-t from-black to-transparent pointer-events-none"></div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="schengen-engine.js"></script>
    <script src="app.js"></script>

    <script>
        // Specific Log Page initialization
        // We ensure app.js handles the background and data sync
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Log Page Ready.");
        });
    </script>

</body>
</html>
