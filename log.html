<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">
    <title>Trip Log</title>
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Lock the viewport and prevent all browser scrolling */
        html, body {
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        /* The scrollable list container */
        #history-window {
            height: 50vh; /* Bottom half of the screen */
            width: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; /* Firefox */
        }
        #history-window::-webkit-scrollbar {
            display: none; /* Safari/Chrome */
        }

        /* Positioning the center button right above the 50% line */
        .center-action-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -100%); /* Pulls it exactly above the midline */
            margin-top: -20px; /* Slight buffer from the divider */
            z-index: 30;
        }
    </style>
</head>

<body id="main-body" class="bg-black">

    <div class="relative h-full w-full flex flex-col">
        
        <!-- TOP HALF: Header and Layout Padding -->
        <div class="h-1/2 w-full flex flex-col items-center pt-16 px-8">
            <h1 class="text-4xl font-black uppercase tracking-tighter text-brutal text-center">
                Trip Log
            </h1>
        </div>

        <!-- CENTER BUTTON: Anchored just above the midline -->
        <div class="center-action-area">
            <a href="add-trip.html" class="brutalist-btn btn-full bg-white">
                Log a past trip
            </a>
        </div>

        <!-- BOTTOM HALF: Transparent Scrollable Window -->
        <div class="h-1/2 w-full flex flex-col items-center">
            <div id="history-window">
                <div id="trip-list" class="flex flex-col items-center w-full px-8 pb-20">
                    <!-- JavaScript will inject trips here -->
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase & Logic -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="schengen-engine.js"></script> 
    <script src="app.js"></script>

    <script>
        function toUK(dateStr) {
            if (!dateStr) return "";
            const [y, m, d] = dateStr.split('-');
            return `${d}.${m}.${y}`;
        }

        function renderTripList() {
            const list = document.getElementById('trip-list');
            if (!window.allTrips) return;

            list.innerHTML = '';

            if (window.allTrips.length === 0) { 
                list.innerHTML = '<p class="text-white font-bold opacity-30 mt-10 uppercase tracking-widest text-[10px]">No History Found</p>'; 
                return; 
            }

            let data = [...window.allTrips];
            data.sort((a,b) => new Date(b.entry) - new Date(a.entry));

            data.forEach(t => {
                const div = document.createElement('div');
                // Creating a basic container for positioning - visual styling to be added next
                div.className = "w-full max-w-[240px] py-4 border-b border-white/10 flex justify-between items-center text-white";
                
                div.innerHTML = `
                    <div class="flex flex-col">
                        <span class="font-black text-sm tracking-tighter">${toUK(t.entry)} — ${toUK(t.exit)}</span>
                    </div>
                    <button onclick="deleteTrip('${t.id}')" class="text-[9px] font-black uppercase text-red-500 underline">Del</button>
                `;
                list.appendChild(div);
            });
        }

        function deleteTrip(tripId) { 
            if(!tripId || tripId === 'undefined') return;
            if(confirm("Permanently delete this trip?")) {
                window.db.ref('trips').child(tripId).remove(); 
            }
        }

        window.addEventListener('tripsUpdated', renderTripList);
        renderTripList();
    </script>
</body>
</html>
