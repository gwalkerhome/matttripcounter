<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Trip Log</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-home text-white">

    <div class="w-full flex justify-between items-center pt-10 mb-6">
        <h1 class="text-3xl font-black">Trip Log</h1>
        <a href="index.html" class="glass-button px-5 py-2 text-xs font-bold uppercase tracking-widest">Done</a>
    </div>

    <div class="w-full mb-6">
        <a href="add-trip.html" class="block w-full py-5 glass-button font-black uppercase tracking-widest">+ Log a Trip</a>
    </div>

    <div class="w-full flex-grow overflow-y-auto px-2" style="margin-left: -0.5rem; width: calc(100% + 1rem); -webkit-overflow-scrolling: touch;">
        <div id="trip-list" class="pb-10">
            </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
    <script>
        const checkDb = setInterval(() => {
            if (window.db) {
                clearInterval(checkDb);
                window.db.ref('trips').on('value', snap => {
                    const list = document.getElementById('trip-list');
                    list.innerHTML = '';
                    if (!snap.exists()) return;
                    
                    let data = [];
                    snap.forEach(c => { data.push({key: c.key, ...c.val()}); });
                    data.sort((a,b) => new Date(b.entry + 'T12:00:00') - new Date(a.entry + 'T12:00:00'));

                    data.reverse().forEach(t => {
                        const entryUK = new Date(t.entry + 'T12:00:00').toLocaleDateString('en-GB');
                        const exitUK = new Date(t.exit + 'T12:00:00').toLocaleDateString('en-GB');
                        
                        const div = document.createElement('div');
                        div.className = 'flex justify-between items-center p-5 mb-3 bg-white/5 rounded-2xl border border-white/10';
                        div.innerHTML = `
                            <div>
                                <div class="text-[10px] uppercase opacity-40 font-bold mb-1">Dates</div>
                                <div class="font-bold text-sm text-white">${entryUK} — ${exitUK}</div>
                            </div>
                            <button onclick="deleteTrip('${t.key}')" class="text-red-400 text-[10px] font-bold px-4 py-2 bg-red-500/10 rounded-full border border-red-500/20 uppercase">Delete</button>
                        `;
                        list.appendChild(div);
                    });
                });
            }
        }, 100);

        function deleteTrip(key) {
            if(confirm("Delete this trip?")) window.db.ref('trips').child(key).remove();
        }
    </script>
</body>
</html>
