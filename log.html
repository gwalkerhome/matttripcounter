<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Trip History</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* The Scrolling Window */
        #history-window {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 50vh; /* Limits height to half the screen */
            overflow-y: auto; /* Enables scrolling */
            padding: 1.5rem;
            -webkit-overflow-scrolling: touch; /* Smooth scroll for iPad */
        }
        /* Custom scrollbar to keep it looking tidy */
        #history-window::-webkit-scrollbar { width: 4px; }
        #history-window::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
    </style>
</head>
<body class="bg-home min-h-screen flex flex-col items-center p-6 text-white">

    <div class="w-full max-w-md flex justify-between items-center mb-8 mt-4">
        <h1 class="text-3xl font-black tracking-tight" style="text-shadow: 0 4px 10px rgba(0,0,0,0.5);">Trip Log</h1>
        <a href="index.html" class="glass-button px-6 py-2 text-sm font-bold">Done</a>
    </div>

    <div class="w-full max-w-md mb-8">
        <a href="add-trip.html" class="block w-full py-5 glass-button font-black text-lg text-center tracking-wide uppercase shadow-2xl">
            + Log a Trip
        </a>
    </div>

    <div class="w-full max-w-md">
        <h2 class="text-lg font-bold mb-4 px-2" style="text-shadow: 0 2px 5px rgba(0,0,0,0.5);">Saved Trips</h2>
        
        <div id="history-window">
            <div id="trip-list" class="space-y-3">
                <p class="text-center opacity-50 italic py-10">Loading history...</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB5l2JrkNaHqpg3KBCwyDW3UTBlv1QSrZo",
            authDomain: "matttrip-56a17.firebaseapp.com",
            projectId: "matttrip-56a17",
            databaseURL: "https://matttrip-56a17-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('trips').on('value', (snapshot) => {
            const tripList = document.getElementById('trip-list');
            tripList.innerHTML = '';
            if (!snapshot.exists()) {
                tripList.innerHTML = '<p class="text-center opacity-50 py-10">No trips recorded yet.</p>';
                return;
            }
            let data = [];
            snapshot.forEach(child => { data.push({ key: child.key, ...child.val() }); });
            data.sort((a, b) => new Date(b.entry) - new Date(a.entry));

            data.forEach(trip => {
                const div = document.createElement('div');
                div.className = 'p-4 flex justify-between items-center bg-white/5 rounded-xl border border-white/10 mb-2';
                div.innerHTML = `
                    <div>
                        <div class="font-bold text-sm text-white">${new Date(trip.entry).toLocaleDateString('en-GB')} — ${new Date(trip.exit).toLocaleDateString('en-GB')}</div>
                    </div>
                    <button onclick="deleteTrip('${trip.key}')" class="text-red-400 text-xs font-bold px-3 py-1 bg-red-500/10 rounded-lg">Delete</button>
                `;
                tripList.appendChild(div);
            });
        });

        function deleteTrip(key) {
            if(confirm("Delete this trip?")) { db.ref('trips').child(key).remove(); }
        }
    </script>

<script src="app.js"></script>
    
</body>
</html>
