<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Native App Meta Tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Journey Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }
        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            border-radius: 4px;
        }
        /* Color Logic */
        .day-past { background: #ef4444; color: white; font-weight: bold; }    /* Red */
        .day-current { background: #f97316; color: white; font-weight: bold; } /* Orange */
        .day-future { background: #22c55e; color: white; font-weight: bold; }  /* Green */
        .day-empty { background: rgba(255,255,255,0.05); opacity: 0.3; }
        .month-name { font-size: 0.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; margin-top: 16px; }
    </style>
</head>
<body id="main-body" class="min-h-screen p-6 text-white bg-black">

    <div class="w-full max-w-md mx-auto">
        <div class="flex justify-between items-center mb-6 mt-4">
            <h1 class="text-2xl font-black tracking-tighter">JOURNEY TRACKER</h1>
            <a href="index.html" class="glass-button px-4 py-2 text-xs font-bold uppercase">Back</a>
        </div>

        <div id="calendar-container" class="space-y-8 pb-20">
            <!-- Months will be injected here -->
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>

    <script>
        const container = document.getElementById('calendar-container');
const today = new Date();
today.setHours(0,0,0,0);

function renderYear() {
    if (!window.allTrips) return;
    container.innerHTML = '';

    for (let i = -6; i <= 6; i++) {
        const monthDate = new Date(today.getFullYear(), today.getMonth() + i, 1);
        renderMonth(monthDate);
    }
    
    setTimeout(() => {
        const currentMonthEl = document.getElementById('current-month');
        if (currentMonthEl) currentMonthEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 500);
}

// ... (keep renderMonth and getDayStatus exactly as they were) ...

// FIX: Listen for the event instead of using setInterval
window.addEventListener('tripsUpdated', () => {
    renderYear();
});


        function renderMonth(date) {
            const month = date.getMonth();
            const year = date.getFullYear();
            const monthName = date.toLocaleString('default', { month: 'long' });
            
            const monthWrapper = document.createElement('div');
            if (month === today.getMonth() && year === today.getFullYear()) {
                monthWrapper.id = 'current-month';
                monthWrapper.className = "border-l-4 border-orange-500 pl-4 py-2 bg-white/5 rounded-r-xl";
            }

            const title = document.createElement('div');
            title.className = 'month-name';
            title.innerText = `${monthName} ${year}`;
            monthWrapper.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'calendar-grid';

            // Padding for start of month
            const firstDay = new Date(year, month, 1).getDay();
            for (let p = 0; p < firstDay; p++) {
                const pad = document.createElement('div');
                grid.appendChild(pad);
            }

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
                const currentDay = new Date(year, month, d);
                currentDay.setHours(0,0,0,0);
                
                const dayEl = document.createElement('div');
                dayEl.className = 'day';
                dayEl.innerText = d;

                const status = getDayStatus(currentDay);
                dayEl.classList.add(status);
                
                grid.appendChild(dayEl);
            }

            monthWrapper.appendChild(grid);
            container.appendChild(monthWrapper);
        }

        function getDayStatus(date) {
            const dateStr = date.toISOString().split('T')[0];
            const isToday = date.getTime() === today.getTime();
            
            let status = 'day-empty';

            window.allTrips.forEach(trip => {
                if (dateStr >= trip.entry && dateStr <= trip.exit) {
                    if (isToday || (dateStr >= trip.entry && dateStr <= trip.exit && date.getTime() === today.getTime())) {
                        status = 'day-current';
                    } else if (date < today) {
                        status = 'day-past';
                    } else {
                        status = 'day-future';
                    }
                }
            });
            
            // Final check for "Today" if not in a trip
            if (isToday && status === 'day-empty') status = 'day-current';

            return status;
        }

        const check = setInterval(() => {
            if (window.allTrips) {
                clearInterval(check);
                renderYear();
            }
        }, 100);
    </script>
</body>
</html>
