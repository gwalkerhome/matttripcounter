<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-10 flex flex-col items-center">

    <h1 class="text-2xl font-bold mb-4">Diagnostic Test</h1>
    <p class="mb-8 opacity-70">Select 1st Jan to 10th Jan below:</p>

    <div id="test-calendar"></div>

    <div class="mt-10 p-6 bg-slate-800 rounded-xl w-full max-w-md border border-white/10">
        <h2 class="text-xs uppercase font-bold opacity-50 mb-4">Widget Output</h2>
        <div id="output" class="font-mono text-green-400">Waiting for selection...</div>
    </div>

    <script>
        flatpickr("#test-calendar", {
            mode: "range",
            inline: true,
            dateFormat: "Y-m-d",
            onChange: function(selectedDates) {
                if (selectedDates.length === 2) {
                    // We check what the WIDGET says vs what JS thinks
                    const rawEntry = selectedDates[0];
                    const rawExit = selectedDates[1];
                    
                    // This is the conversion we use for Firebase
                    const firebaseEntry = flatpickr.formatDate(rawEntry, "Y-m-d");
                    const firebaseExit = flatpickr.formatDate(rawExit, "Y-m-d");

                    document.getElementById('output').innerHTML = `
                        <b>Raw JS Start:</b> ${rawEntry.toString()}<br>
                        <b>Raw JS End:</b> ${rawExit.toString()}<br><br>
                        <span class="text-white font-bold">SENT TO DATABASE:</span><br>
                        Entry: ${firebaseEntry}<br>
                        Exit: ${firebaseExit}
                    `;
                }
            }
        });
    </script>
</body>
</html>
