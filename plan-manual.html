<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Native App Meta Tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Manual Trip Planner</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body id="main-body" class="min-h-screen flex flex-col items-center p-6 text-white">

    <!-- Live Advisor Header -->
    <div class="w-full max-w-md glass-card p-6 rounded-[2rem] mb-6 text-center">
        <p id="advisor-label" class="text-[10px] uppercase tracking-widest opacity-60 mb-1">Select a Start Date</p>
        <div id="big-allowance" class="text-6xl font-black mb-2">--</div>
        <div class="flex justify-around text-[10px] uppercase font-bold opacity-80 pt-4 border-t border-white/10">
            <div>Used: <span id="stat-used" class="text-orange-400">0</span></div>
            <div>Remaining: <span id="stat-remain" class="text-green-400">--</span></div>
        </div>
    </div>

    <!-- Calendar Container -->
    <div class="w-full max-w-md flex justify-center">
        <div id="manual-calendar"></div>
    </div>

    <!-- Action Button -->
    <div class="w-full max-w-xs mt-8">
        <button onclick="commitTrip()" id="commit-btn" 
                class="w-full py-5 bg-white text-black font-black rounded-2xl shadow-xl opacity-20 transition-all uppercase tracking-widest" disabled>
            Commit to Log
        </button>
        <button onclick="window.location.href='plan.html'" class="w-full mt-4 text-xs font-bold opacity-40 uppercase">Cancel</button>
    </div>

    <!-- Logic -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="schengen-engine.js"></script>
    <script src="app.js"></script>

    <script>
        let planEntry = null;
        let planExit = null;

        const fp = flatpickr("#manual-calendar", {
            inline: true,
            mode: "range",
            showMonths: 1,
            onChange: function(selectedDates) {
                if (selectedDates.length === 1) {
                    // FIRST CLICK: Show allowance from this start date
                    planEntry = selectedDates[0];
                    const status = SchengenEngine.calculateStatus(window.allTrips, planEntry);
                    
                    document.getElementById('advisor-label').innerText = "Available on " + planEntry.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
                    document.getElementById('big-allowance').innerText = status.remaining;
                    updateStats(0, status.remaining);
                    toggleButton(false);
                } 
                else if (selectedDates.length === 2) {
                    // SECOND CLICK: Show impact of the full trip
                    planEntry = selectedDates[0];
                    planExit = selectedDates[1];

                    // Calculate duration
                    const diffTime = Math.abs(planExit - planEntry);
                    const duration = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

                    // Calculate final balance after trip
                    const tempTrip = { 
                        entry: planEntry.toISOString().split('T')[0], 
                        exit: planExit.toISOString().split('T')[0] 
                    };
                    const finalStatus = SchengenEngine.calculateStatus([...window.allTrips, tempTrip], planExit);

                    document.getElementById('advisor-label').innerText = "Balance After Trip";
                    document.getElementById('big-allowance').innerText = finalStatus.remaining;
                    updateStats(duration, finalStatus.remaining);
                    
                    // Only allow commit if it doesn't break the rules
                    toggleButton(finalStatus.remaining >= 0);
                }
            }
        });

        function updateStats(used, remain) {
            document.getElementById('stat-used').innerText = used;
            document.getElementById('stat-remain').innerText = remain;
        }

        function toggleButton(isValid) {
            const btn = document.getElementById('commit-btn');
            btn.disabled = !isValid;
            btn.style.opacity = isValid ? "1" : "0.2";
            if (!isValid && planExit) {
                document.getElementById('big-allowance').innerText = "⚠️";
                document.getElementById('advisor-label').innerText = "Over Limit!";
            }
        }

        function commitTrip() {
            if (!planEntry || !planExit) return;
            const entryStr = planEntry.toISOString().split('T')[0];
            const exitStr = planExit.toISOString().split('T')[0];
            
            window.db.ref('trips').push({
                entry: entryStr,
                exit: exitStr,
                timestamp: Date.now()
            }).then(() => {
                window.location.href = 'index.html';
            });
        }
    </script>
</body>
</html>
