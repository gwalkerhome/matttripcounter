<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">
    <title>Matt's Journey</title>
    <link rel="apple-touch-icon" href="assets/icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #bottom-actions {
            position: absolute;
            bottom: calc(24px + env(safe-area-inset-bottom));
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div id="bg-layer"></div>

    <div id="ui-layer">

        <!-- TOP STATUS -->
        <div style="position:absolute; top: calc(20px + env(safe-area-inset-top)); left:0; right:0; text-align:center;">
            <h1 id="status-message" class="text-brutal" style="font-size:0.75rem; font-weight:900; text-transform:uppercase; letter-spacing:0.4em; margin:0;">Syncing...</h1>
        </div>

        <!-- GAUGE -->
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -55%);">
            <div style="position:relative; display:flex; align-items:center; justify-content:center;">
                <svg style="width:288px; height:288px; transform:rotate(-90deg);">
                    <circle cx="144" cy="144" r="70" stroke="rgba(255,255,255,0.1)" stroke-width="12" fill="transparent"/>
                    <circle id="gauge-progress-border" cx="144" cy="144" r="70" stroke="black" stroke-width="22" fill="transparent"
                        stroke-dasharray="439.8" stroke-dashoffset="439.8" stroke-linecap="round"/>
                    <circle id="gauge-progress" cx="144" cy="144" r="70" stroke="#2ED573" stroke-width="12" fill="transparent"
                        stroke-dasharray="439.8" stroke-dashoffset="439.8" stroke-linecap="round"/>
                </svg>
                <div style="position:absolute; text-align:center;">
                    <div id="days-count" class="text-brutal" style="font-size:5rem; font-weight:900; line-height:1; letter-spacing:-0.05em; -webkit-text-stroke:3px black; paint-order:stroke fill;">--</div>
                    <div class="text-brutal" style="font-size:0.5rem; font-weight:700; text-transform:uppercase; letter-spacing:0.2em; margin-top:8px; max-width:120px;">Schengen Allowance Days Remaining</div>
                </div>
            </div>

            <!-- RECOVERY TAGLINE: pulled up tight using negative margin to compensate for SVG whitespace -->
            <div id="recovery-tagline" class="text-brutal" style="margin-top:-44px; text-align:center; font-size:0.7rem; font-weight:900; text-transform:uppercase; letter-spacing:0.15em; line-height:1.6;"></div>
        </div>

        <!-- BOTTOM BUTTON -->
        <div id="bottom-actions">
            <button onclick="window.location.href='calendar.html'" class="brutalist-btn btn-full bg-pink">View &amp; Edit Trips</button>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="schengen-engine.js"></script>
    <script src="app.js"></script>
</body>
</html>
