<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">
    <title>Matt's Journey</title>

    <link rel="apple-touch-icon" href="assets/icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
            margin: 0;
            padding: 0;
            background-color: #000;
        }

        #bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            z-index: 0;
        }

        #app-shell {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            /* Using standard safe-area padding for a native feel */
            padding: calc(40px + env(safe-area-inset-top)) 32px calc(20px + env(safe-area-inset-bottom));
            z-index: 10;
        }

        /* Ensure the gauge doesn't feel cramped */
        .gauge-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
    </style>
</head>

<body id="main-body">

    <div id="bg-layer"></div>

    <div id="app-shell">

        <div class="w-full flex justify-center items-center z-20">
            <h1 id="status-message" class="text-[12px] font-black uppercase tracking-[0.4em] text-brutal">Syncing...</h1>
        </div>

        <div class="gauge-wrap z-10">
            <div class="relative flex items-center justify-center">
                <svg class="w-72 h-72 transform -rotate-90">
                    <circle cx="144" cy="144" r="70" stroke="rgba(255,255,255,0.1)" stroke-width="12" fill="transparent" />
                    <circle id="gauge-progress-border" cx="144" cy="144" r="70" stroke="black" stroke-width="22" fill="transparent"
                        stroke-dasharray="439.8" stroke-dashoffset="439.8" stroke-linecap="round" />
                    <circle id="gauge-progress" cx="144" cy="144" r="70" stroke="#2ED573" stroke-width="12" fill="transparent"
                        stroke-dasharray="439.8" stroke-dashoffset="439.8" stroke-linecap="round" />
                </svg>

                <div class="absolute text-center">
                    <div id="days-count" class="text-8xl font-black text-white leading-none tracking-tighter"
                         style="filter: drop-shadow(6px 6px 0px black); -webkit-text-stroke: 3px black; paint-order: stroke fill;">
                        --
                    </div>
                    <div class="text-[8px] font-bold text-white uppercase tracking-[0.2em] mt-2 text-brutal max-w-[120px] mx-auto">
                        Schengen Allowance days remaining
                    </div>
                </div>
            </div>

            <div id="recovery-tagline"
                 class="absolute bottom-[-40px] left-1/2 -translate-x-1/2 w-72 text-center text-[11px] font-black tracking-widest uppercase leading-relaxed text-brutal">
            </div>
        </div>

        <div class="w-full flex flex-col items-center space-y-3 z-20 pb-4">
            <a href="plan.html" class="brutalist-btn btn-full bg-white">Plan Ahead</a>
            <div class="flex gap-3">
                <a href="log.html" class="brutalist-btn btn-half bg-blue">View past trips</a>
                <a href="journey.html" class="brutalist-btn btn-half bg-pink">Calendar View</a>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="schengen-engine.js"></script>
    <script src="app.js"></script>

</body>
</html>
