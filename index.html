<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Matt's Journey - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Keep Tailwind for layout/spacing only -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="main-body" class="flex flex-col items-center justify-between py-10">

    <!-- TOP SECTION: The Gauge -->
    <div class="mt-10 flex flex-col items-center">
        <!-- Brutalist Gauge Container -->
        <div class="relative w-64 h-64 bg-white border-[4px] border-black rounded-full flex items-center justify-center shadow-[8px_8px_0px_rgba(0,0,0,1)]">
            <svg class="w-56 h-56 transform -rotate-90">
                <circle cx="112" cy="112" r="100" stroke="rgba(0,0,0,0.1)" stroke-width="12" fill="transparent" />
                <circle id="gauge-progress" cx="112" cy="112" r="100" stroke="#FFDE03" stroke-width="12" fill="transparent"
                    stroke-dasharray="628" stroke-dashoffset="628" stroke-linecap="round" />
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
                <span id="days-count" class="text-6xl font-black text-black">0</span>
                <span class="text-xs font-bold uppercase tracking-widest text-black opacity-60">Days Left</span>
            </div>
        </div>
        <p id="status-text" class="mt-6 text-white font-bold text-lg uppercase tracking-widest text-shadow">
            Ready to Roll
        </p>
    </div>

    <!-- MIDDLE SECTION: Primary Actions -->
    <div class="flex flex-col gap-5">
        <a href="plan.html" class="brutalist-btn btn-l bg-yellow">Plan a Trip</a>
        <a href="log.html" class="brutalist-btn btn-l bg-white">Log History</a>
    </div>

    <!-- BOTTOM SECTION: Navigation & Settings -->
    <div class="flex gap-4 mb-6">
        <a href="map.html" class="brutalist-btn btn-s bg-blue">Map</a>
        <a href="docs.html" class="brutalist-btn btn-s bg-pink">Docs</a>
        <a href="stats.html" class="brutalist-btn btn-s bg-green">Stats</a>
        <a href="settings.html" class="brutalist-btn btn-s bg-white">Set</a>
    </div>

    <!-- App Logic Integration -->
    <script src="app.js"></script>
    <script>
        // Quick Gauge Initializer for Demo
        document.addEventListener('DOMContentLoaded', () => {
            const circle = document.getElementById('gauge-progress');
            const circumference = 2 * Math.PI * 100;
            // Example: 70% complete
            const offset = circumference - (0.7 * circumference);
            circle.style.strokeDashoffset = offset;
        });
    </script>

</body>
</html>
