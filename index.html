<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">
    <title>Matt's Journey</title>

    <link rel="apple-touch-icon" href="assets/icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
            margin: 0;
            padding: 0;
            background-color: black;
        }

        #bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-size: 100% 100%;
            background-position: center top;
            background-repeat: no-repeat;
            z-index: -1;
        }

        #bottom-actions {
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }
    </style>
</head>

<body id="main-body">

    <div id="bg-layer"></div>

    <div style="height: 100dvh;" class="w-full flex flex-col items-center justify-between pt-12 px-8 overflow-hidden relative">

        <!-- TOP SECTION -->
        <div class="w-full flex justify-center items-center mt-4 z-20">
            <div class="text-center">
                <h1 id="status-message" class="text-[12px] font-black uppercase tracking-[0.4em] text-brutal">Syncing...</h1>
            </div>
        </div>

        <!-- GAUGE & TAGLINE SECTION -->
        <div class="relative flex flex-col items-center justify-center z-10">
            <div class="relative flex items-center justify-center">
                <svg class="w-72 h-72 transform -rotate-90">
                    <circle cx="144" cy="144" r="70" stroke="rgba(255,255,255,0.1)" stroke-width="12" fill="transparent" />
                    <circle id="gauge-progress-border" cx="144" cy="144" r="70" stroke="black" stroke-width="22" fill="transparent"
                        stroke-dasharray="439.8" stroke-dashoffset="439.8" stroke-linecap="round" />
                    <circle id="gauge-progress" cx="144" cy="144" r="70" stroke="#2ED573" stroke-width="12" fill="transparent"
                        stroke-dasharray="439.8" stroke-dashoffset="439.8" stroke-linecap="round" />
