<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Matt's Spain Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="apple-touch-icon" href="assets/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-home text-white">

    <div class="w-full pt-10 text-center">
        <h1 class="text-3xl font-black tracking-tight">Hola, Matt!</h1>
    </div>

    <div class="flex-grow flex items-center justify-center w-full">
        <div class="relative w-64 h-64">
            <svg class="w-full h-full" viewBox="0 0 100 100">
                <circle class="text-white/10" stroke="currentColor" stroke-width="8" fill="transparent" r="40" cx="50" cy="50"/>
                <circle id="gauge-progress" class="text-orange-400" stroke="currentColor" stroke-width="8" stroke-dasharray="251.2" stroke-dashoffset="251.2" stroke-linecap="round" fill="transparent" r="40" cx="50" cy="50" transform="rotate(-90 50 50)"/>
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
                <span id="days-count" class="text-7xl font-black leading-none">--</span>
                <span class="text-[10px] uppercase tracking-[0.2em] opacity-60 mt-3">Days Left</span>
            </div>
        </div>
    </div>

    <div class="w-full max-w-sm pb-10 space-y-4">
        <p id="status-message" class="text-center text-sm italic opacity-60 mb-4">Syncing...</p>
        <a href="log.html" class="block w-full py-5 glass-button font-black uppercase tracking-widest text-sm">View Trip Log</a>
        <a href="#" class="block w-full py-5 glass-button font-black uppercase tracking-widest text-sm opacity-40">Plan Future Trips</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
