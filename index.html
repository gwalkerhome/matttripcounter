<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Schengen Tracker</title>
    <link rel="apple-touch-icon" href="assets/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="main-body" class="text-white overflow-hidden bg-black">

    <header class="w-full pt-8 flex justify-center z-50">
        <h1 class="text-xl font-black italic tracking-[0.3em] uppercase opacity-80 text-shadow">Schengen Tracker</h1>
    </header>

    <!-- Content starts exactly at V30 (20% of 150) -->
    <main class="w-full pt-[20vh] flex flex-col items-center"> 
        <div class="relative flex items-center justify-center">
            <svg class="w-80 h-80 transform -rotate-90">
                <circle cx="160" cy="160" r="70" stroke="rgba(255,255,255,0.15)" stroke-width="14" fill="transparent" />
                <circle id="gauge-progress" cx="160" cy="160" r="70" stroke="white" stroke-width="14" fill="transparent" 
                        stroke-dasharray="439.8" stroke-dashoffset="439.8" stroke-linecap="round" />
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                <span id="days-count" class="text-[9.5rem] font-black leading-none tracking-tighter text-shadow">--</span>
                <span class="text-[11px] uppercase tracking-[0.4em] font-black mt-[-15px] z-20 text-shadow">Days Available</span>
                <div id="recovery-tagline" class="text-[10px] font-bold uppercase tracking-widest mt-10 px-10 leading-relaxed text-shadow"></div>
            </div>
        </div>
        <p id="status-message" class="text-sm font-black uppercase tracking-[0.2em] opacity-90 mt-6 text-shadow">Calculating...</p>
    </main>

    <footer class="fixed bottom-0 w-full max-w-md px-6 pb-12 space-y-4 z-50 left-1/2 -translate-x-1/2">
        <div class="grid grid-cols-2 gap-4">
            <a href="plan.html" class="glass-button py-6 flex flex-col items-center justify-center">
                <span class="text-[10px] font-black uppercase tracking-widest text-shadow">Plan Ahead</span>
            </a>
            <a href="journey.html" class="glass-button py-6 flex flex-col items-center justify-center">
                <span class="text-[10px] font-black uppercase tracking-widest text-shadow">Overview</span>
            </a>
        </div>
        <a href="add-trip.html" class="w-full flex items-center justify-center py-5 bg-white text-black rounded-[2rem] font-black uppercase tracking-widest active:scale-95 transition-transform shadow-xl">
            Add New Trip
        </a>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="schengen-engine.js"></script>
    <script src="app.js"></script>
</body>
</html>
