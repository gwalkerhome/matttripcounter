<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Matt's Journey</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="main-body" class="flex flex-col items-center justify-between py-10">

    <!-- TOP: The Gauge (Restored to original structure) -->
    <div class="mt-10 flex flex-col items-center">
        <div class="relative w-64 h-64 flex items-center justify-center">
            <svg class="w-full h-full transform -rotate-90">
                <circle cx="128" cy="128" r="110" stroke="rgba(255,255,255,0.2)" stroke-width="12" fill="transparent" />
                <circle id="gauge-progress" cx="128" cy="128" r="110" stroke="white" stroke-width="12" fill="transparent"
                    stroke-dasharray="691" stroke-dashoffset="691" stroke-linecap="round" />
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center text-white">
                <span id="days-count" class="text-7xl font-black">0</span>
                <span class="text-sm font-bold uppercase tracking-widest opacity-80">Days Left</span>
            </div>
        </div>
        <p id="status-text" class="mt-6 text-white font-bold text-lg uppercase tracking-widest text-shadow">
            Loading...
        </p>
    </div>

    <!-- MIDDLE: Primary Actions (Updated to Stage 1) -->
    <div class="flex flex-col gap-5">
        <a href="plan.html" class="brutalist-btn btn-l bg-yellow">Plan a Trip</a>
        <a href="log.html" class="brutalist-btn btn-l bg-white">Log History</a>
    </div>

    <!-- BOTTOM: Navigation (Updated to Stage 1) -->
    <div class="flex gap-3 mb-6">
        <a href="map.html" class="brutalist-btn btn-s bg-blue">Map</a>
        <a href="docs.html" class="brutalist-btn btn-s bg-pink">Docs</a>
        <a href="stats.html" class="brutalist-btn btn-s bg-green">Stats</a>
        <a href="settings.html" class="brutalist-btn btn-s bg-white">Set</a>
    </div>

    <!-- Original App Logic (Untouched) -->
    <script src="app.js"></script>
</body>
</html>
