<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Retro Brutalist Rounded</title>
    <style>
        body {
            margin: 0;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
            min-height: 100vh;
            background-image: url('assets/uk2.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            /* Native iOS Rounded Font Stack */
            font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
        }

        .brutalist-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            font-weight: 800; /* Heavy weight for cartoon feel */
            border: 3.5px solid #000;
            box-shadow: 6px 6px 0px #000;
            border-radius: 18px; /* Rounded corners for the 'sticker' look */
            transition: all 0.1s;
            cursor: pointer;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* The 'Highlight' - makes it look more like a cartoon sticker */
        .brutalist-btn::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            height: 30%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px 12px 4px 4px;
            pointer-events: none;
        }

        .brutalist-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0px #000;
        }

        .btn-l {
            width: 240px;
            height: 60px;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
        }

        .btn-s {
            width: 60px;
            height: 60px;
            font-size: 0.7rem;
            text-align: center;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        /* Vibrant Cartoon Colors */
        .yellow { background-color: #FFDE03; color: #000; }
        .blue   { background-color: #00A8FF; color: #fff; }
        .pink   { background-color: #FF4DFF; color: #fff; }
        .green  { background-color: #2ED573; color: #fff; }
        .white  { background-color: #FFFFFF; color: #000; }

        .label {
            color: white;
            background: black;
            padding: 2px 12px;
            font-size: 0.65rem;
            font-weight: 900;
            border-radius: 4px;
            margin-bottom: -12px;
            z-index: 10;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="label">Primary</div>
    <div class="brutalist-btn btn-l yellow">Plan a Trip</div>

    <div class="label">Secondary</div>
    <div class="brutalist-btn btn-l white">Log History</div>
    
    <div class="row">
        <div class="brutalist-btn btn-s blue">Map</div>
        <div class="brutalist-btn btn-s pink">Docs</div>
        <div class="brutalist-btn btn-s green">Stats</div>
    </div>

</body>
</html>
