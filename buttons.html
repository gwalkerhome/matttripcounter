<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fixed Button Sandbox</title>
    <style>
        body {
            margin: 0;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
            min-height: 100vh;
            background-image: url('assets/uk2.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-family: -apple-system, system-ui, sans-serif;
            overflow-x: hidden;
        }

        /* Frosted Glass Effect */
        .glass-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            color: white;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: transform 0.1s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            box-sizing: border-box;
            cursor: pointer;
        }

        .glass-btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.2);
        }

        /* Precise Fixed Dimensions */
        .btn-large {
            width: 240px;
            height: 80px;
            font-size: 1rem;
        }

        .btn-small {
            width: 80px;
            height: 80px;
            font-size: 0.7rem;
            text-align: center;
            padding: 5px;
        }

        .button-row {
            display: flex;
            gap: 15px;
            width: 240px; /* Match large button width for alignment */
            justify-content: space-between;
        }

        /* Colors */
        .blue   { background: rgba(0, 122, 255, 0.25); }
        .orange { background: rgba(255, 149, 0, 0.25); }
        .green  { background: rgba(52, 199, 89, 0.25); }
        .white  { background: rgba(255, 255, 255, 0.12); }

    </style>
</head>
<body>

    <div class="glass-btn btn-large blue">Plan a Trip</div>
    <div class="glass-btn btn-large orange">Log a Past Trip</div>
    
    <div class="button-row">
        <div class="glass-btn btn-small green">Profile</div>
        <div class="glass-btn btn-small white">Settings</div>
        <div class="glass-btn btn-small white">Help</div>
    </div>

    <div class="glass-btn btn-large white">Manual Entry</div>

</body>
</html>
