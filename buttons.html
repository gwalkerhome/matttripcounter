<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Button Style Experiment</title>
    <style>
        body {
            margin: 0;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
            min-height: 100vh;
            background-image: url('assets/uk2.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            font-family: -apple-system, system-ui, sans-serif;
            color: white;
        }

        .section-label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.8;
            margin-top: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .btn-l { width: 240px; height: 60px; display: flex; align-items: center; justify-content: center; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.1s; border: none; }
        .btn-s { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.6rem; cursor: pointer; transition: 0.1s; border: none; }
        .row { display: flex; gap: 12px; }

        /* 1. NEUMORPHIC / SOFT UI */
        .neu {
            background: #e0e0e0;
            color: #444;
            border-radius: 15px;
            box-shadow: 7px 7px 15px #bebebe, -7px -7px 15px #ffffff;
        }

        /* 2. SKEUOMORPHIC (3D Plastic) */
        .skeuo {
            background: linear-gradient(145deg, #3a86ff, #2b64bf);
            border-radius: 50px;
            box-shadow: 0 6px 0 #1a4a94, 0 8px 15px rgba(0,0,0,0.4);
            border-top: 2px solid rgba(255,255,255,0.3);
            text-shadow: 0 -1px 1px rgba(0,0,0,0.5);
        }
        .skeuo:active { transform: translateY(4px); box-shadow: 0 2px 0 #1a4a94; }

        /* 3. SOLID & STATIC (High Contrast) */
        .solid {
            background: #000;
            color: #fff;
            border: 3px solid #fff;
            border-radius: 0px; /* Sharp corners */
            letter-spacing: 0.2em;
        }

        /* 4. GLOSSY / 3D EFFECT */
        .glossy {
            background: linear-gradient(to bottom, #ff5f6d, #ffc371);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(255, 95, 109, 0.4);
        }
        .glossy::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 50%;
            background: rgba(255,255,255,0.2);
        }

        /* 5. OUTLINE WITH HEAVY DROP SHADOW */
        .retro {
            background: #fff;
            color: #000;
            border: 2px solid #000;
            box-shadow: 6px 6px 0px #000;
            border-radius: 4px;
        }
        .retro:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px #000; }

        /* 6. NEON VAPOR */
        .neon {
            background: transparent;
            border: 2px solid #00f2ff;
            color: #00f2ff;
            border-radius: 30px;
            box-shadow: 0 0 10px #00f2ff, inset 0 0 5px #00f2ff;
            text-shadow: 0 0 5px #00f2ff;
        }

    </style>
</head>
<body>

    <div class="section-label">3D Skeuomorphic</div>
    <div class="btn-l skeuo">Book Flight</div>
    <div class="row">
        <div class="btn-s skeuo">MAP</div>
        <div class="btn-s skeuo" style="background: #ff006e; box-shadow: 0 6px 0 #9e0045;">SOS</div>
    </div>

    <div class="section-label">Glossy Gradient</div>
    <div class="btn-l glossy">Start Journey</div>

    <div class="section-label">Retro / Brutalist</div>
    <div class="btn-l retro">Manual Entry</div>
    <div class="row">
        <div class="btn-s retro">LOG</div>
        <div class="btn-s retro">EDIT</div>
    </div>

    <div class="section-label">Solid Static</div>
    <div class="btn-l solid">Settings</div>

    <div class="section-label">Neon Glow</div>
    <div class="btn-l neon">View Stats</div>

    <div class="section-label">Neumorphic (Soft)</div>
    <div class="btn-l neu">Profile</div>

</body>
</html>
