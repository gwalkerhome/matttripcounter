<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sleek Button Sandbox</title>
    <style>
        body {
            margin: 0;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
            min-height: 100vh;
            background-image: url('assets/uk2.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: -apple-system, system-ui, sans-serif;
            overflow-x: hidden;
        }

        /* Frosted Glass Effect */
        .glass-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px; /* Slightly tighter radius for shorter height */
            border: 1px solid rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: transform 0.1s ease, background 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
            box-sizing: border-box;
            cursor: pointer;
        }

        .glass-btn:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.25);
        }

        /* New Locked Dimensions */
        .btn-large {
            width: 240px;
            height: 60px;
            font-size: 0.9rem;
        }

        .btn-small {
            width: 60px;
            height: 60px;
            font-size: 0.6rem;
            text-align: center;
            padding: 4px;
        }

        .button-row {
            display: flex;
            gap: 12px;
            width: 240px; 
            justify-content: center;
        }

        /* Colors */
        .blue   { background: rgba(0, 122, 255, 0.28); }
        .orange { background: rgba(255, 149, 0, 0.28); }
        .green  { background: rgba(52, 199, 89, 0.28); }
        .white  { background: rgba(255, 255, 255, 0.15); }

    </style>
</head>
<body>

    <div class="glass-btn btn-large blue">Plan a Trip</div>
    <div class="glass-btn btn-large orange">Log a Past Trip</div>
    
    <div class="button-row">
        <div class="glass-btn btn-small green">Profile</div>
        <div class="glass-btn btn-small white">Docs</div>
        <div class="glass-btn btn-small white">Help</div>
        <div class="glass-btn btn-small white">Set</div>
    </div>

    <div class="glass-btn btn-large white">Manual Entry</div>

</body>
</html>
