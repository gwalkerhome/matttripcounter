<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Sandbox - Matt's Journey</title>
    <style>
        /* Standalone Styling */
        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            /* Using the requested background */
            background-image: url('assets/uk2.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            font-family: -apple-system, system-ui, sans-serif;
        }

        h1 {
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        /* Base Frosted Glass Style */
        .glass-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px; /* Highly rounded for the pill look */
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px) saturate(180%);
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            color: white;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .glass-btn:active {
            transform: scale(0.96);
        }

        /* Dimensions as specified */
        .btn-large {
            width: 600px;
            height: 180px;
            font-size: 2.5rem;
        }

        .btn-small {
            width: 180px;
            height: 180px;
            font-size: 1rem;
            text-align: center;
            border-radius: 50px; /* Slightly different radius for squares */
        }

        /* Random Color Sets */
        .bg-blue   { background: rgba(59, 130, 246, 0.2); }
        .bg-orange { background: rgba(249, 115, 22, 0.25); }
        .bg-green  { background: rgba(34, 197, 94, 0.2); }
        .bg-red    { background: rgba(239, 68, 68, 0.2); }
        .bg-white  { background: rgba(255, 255, 255, 0.1); }

        /* Container for small buttons to show them side-by-side */
        .button-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
</head>
<body>

    <h1>Button Test Sandbox</h1>

    <div class="glass-btn btn-large bg-blue">Plan a Trip</div>
    <div class="glass-btn btn-large bg-orange">Log a Past Trip</div>
    
    <div class="button-row">
        <div class="glass-btn btn-small bg-green">Profile</div>
        <div class="glass-btn btn-small bg-white">Cancel</div>
        <div class="glass-btn btn-small bg-red">Alert</div>
    </div>

    <div class="glass-btn btn-large bg-white">Manually Enter Trip</div>

</body>
</html>
