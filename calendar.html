<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">
    <title>Trip Calendar</title>
    <link rel="apple-touch-icon" href="assets/icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #calendar-scroll {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: calc(env(safe-area-inset-top) + 118px) 20px calc(env(safe-area-inset-bottom) + 78px);
        }
        #calendar-scroll::-webkit-scrollbar { display: none; }

        .month-block { margin-bottom: 28px; }

        .month-label {
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.5);
            margin-bottom: 8px;
            padding-left: 2px;
        }

        .day-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }

        .day-header {
            text-align: center;
            font-size: 0.55rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: rgba(255,255,255,0.3);
            padding-bottom: 4px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .day-cell:active { transform: scale(0.88); }

        /* VIEW MODE */
        .day-empty   { background: transparent; cursor: default; }
        .day-blank   { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.45); cursor: default; }
        .day-past    { background: #FF4DFF; color: #000; border-color: #000; box-shadow: 2px 2px 0 #000; }
        .day-current { background: #2ED573; color: #000; border-color: #000; box-shadow: 2px 2px 0 #000; }
        .day-future  { background: #00A8FF; color: #000; border-color: #000; box-shadow: 2px 2px 0 #000; }
        .day-today   { outline: 2.5px solid #fff; outline-offset: 1px; }

        /* PLANNING MODE */
        .plan-blank    { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.45); cursor: pointer; }
        .plan-green    { background: rgba(46,213,115,0.25); color: #2ED573; border-color: rgba(46,213,115,0.4); cursor: pointer; }
        .plan-red      { background: rgba(239,68,68,0.25); color: #ef4444; border-color: rgba(239,68,68,0.4); cursor: not-allowed; }
        .plan-selected { background: #FFDE03; color: #000; border-color: #000; box-shadow: 2px 2px 0 #000; cursor: pointer; }
        .plan-range    { background: rgba(46,213,115,0.5); color: #fff; border-color: rgba(46,213,115,0.6); cursor: pointer; }
        .plan-locked   { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.2); cursor: not-allowed; }

        /* PLANNING MODE FOOTER */
        #plan-footer {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 30;
            background: linear-gradient(to top,
                rgba(0,0,0,0.85) 0%,
                rgba(0,0,0,0.85) 60%,
                transparent 100%);
            padding: 16px 20px calc(env(safe-area-inset-bottom) + 12px);
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        #plan-status {
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.6);
            text-align: center;
        }

        #page-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 30;
            background: linear-gradient(to bottom,
                rgba(0,0,0,0.85) 0%,
                rgba(0,0,0,0.85) 75%,
                transparent 100%);
            padding: calc(env(safe-area-inset-top) + 10px) 16px 16px;
        }

        .info-strip {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .info-pill {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 5px 8px;
            text-align: center;
        }

        .info-pill-label {
            font-size: 0.45rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255,255,255,0.4);
            display: block;
        }

        .info-pill-value {
            font-size: 0.8rem;
            font-weight: 900;
            color: #fff;
            display: block;
            margin-top: 1px;
            line-height: 1.1;
        }

        #page-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 30;
            background: linear-gradient(to top,
                rgba(0,0,0,0.85) 0%,
                rgba(0,0,0,0.85) 60%,
                transparent 100%);
            padding: 16px 20px calc(env(safe-area-inset-bottom) + 12px);
            display: flex;
            justify-content: center;
        }

        #overlay-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 50;
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
        }

        #action-sheet, #add-sheet {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 60;
            background: #1a1a1a;
            border-top: 2.5px solid #fff;
            border-radius: 24px 24px 0 0;
            padding: 24px 24px calc(env(safe-area-inset-bottom) + 20px);
        }

        .sheet-title {
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.4);
            margin-bottom: 16px;
            text-align: center;
        }

        .sheet-btn-row {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .nav-themed {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            border: 2.5px solid #000;
            box-shadow: 3px 3px 0 #000;
            cursor: pointer;
            text-decoration: none;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-themed:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #000;
        }

        .nav-themed svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .nav-back-themed { background: #FFDE03; }
        .nav-back-themed svg { stroke: #000; }
        .nav-help-themed { background: #FF4DFF; }
        .nav-help-themed svg { stroke: #000; }
    </style>
</head>

<body>
    <div id="bg-layer"></div>

    <div id="ui-layer">

        <div id="page-header">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
                <a class="nav-themed nav-back-themed" onclick="history.back()">
                    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                </a>
                <h1 class="text-brutal" style="font-size:0.8rem; font-weight:900; text-transform:uppercase; letter-spacing:0.2em; margin:0; text-align:center; flex:1;">Trip Calendar</h1>
                <a class="nav-themed nav-help-themed" href="help.html">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17" stroke-width="3"/></svg>
                </a>
            </div>

            <div class="info-strip">
                <div class="info-pill">
                    <span class="info-pill-label">Days Remaining</span>
                    <span class="info-pill-value" id="info-remaining" style="color:#2ED573;">--</span>
                </div>
                <div class="info-pill">
                    <span class="info-pill-label" id="info-status-label">Status</span>
                    <span class="info-pill-value" id="info-status-value">--</span>
                </div>
            </div>
        </div>

        <div id="calendar-scroll">
            <div id="calendar-container"></div>
        </div>

        <!-- VIEW MODE FOOTER -->
        <div id="page-footer">
            <button onclick="enterPlanningMode()" class="brutalist-btn btn-full bg-green" style="font-size:0.85rem;">+ Add Trip</button>
        </div>

        <!-- PLANNING MODE FOOTER -->
        <div id="plan-footer">
            <div id="plan-status">Tap a start date</div>
            <div style="display:flex; gap:10px; width:100%; max-width:300px;">
                <button onclick="exitPlanningMode()" class="brutalist-btn btn-half" style="background:rgba(255,255,255,0.1); color:#fff; border-color:rgba(255,255,255,0.3); box-shadow:none;">Cancel</button>
                <button id="plan-save-btn" onclick="savePlanningTrip()" class="brutalist-btn" style="flex:1; height:60px; background:#2ED573; color:#000; border-color:#000; font-size:0.85rem; opacity:0.3;" disabled>Save Trip</button>
            </div>
        </div>

    </div>

    <div id="overlay-backdrop" onclick="closeAll()"></div>

    <!-- ACTION SHEET (tap existing trip) -->
    <div id="action-sheet">
        <p class="sheet-title" id="action-sheet-title">Trip Options</p>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <button onclick="editSelectedTrip()" class="brutalist-btn btn-full bg-blue" style="width:100%;">Edit Trip</button>
            <button onclick="deleteSelectedTrip()" class="brutalist-btn btn-full" style="width:100%; background:#ef4444; color:#fff; border-color:#000;">Delete Trip</button>
            <button onclick="closeAll()" style="background:none; border:none; color:rgba(255,255,255,0.4); font-size:0.7rem; font-weight:900; text-transform:uppercase; letter-spacing:0.1em; cursor:pointer; margin-top:4px;">Cancel</button>
        </div>
    </div>

    <!-- EDIT SHEET -->
    <div id="add-sheet">
        <p class="sheet-title" id="add-sheet-title">Edit Trip</p>
        <div style="display:flex; gap:10px; margin-bottom:16px;">
            <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
                <label style="font-size:0.55rem; font-weight:900; text-transform:uppercase; letter-spacing:0.15em; color:rgba(255,255,255,0.4);">Entry Date</label>
                <input type="date" id="input-entry" style="width:100%; background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.2); border-radius:10px; color:#fff; font-size:0.85rem; font-weight:800; padding:8px 10px; font-family:inherit; -webkit-appearance:none;">
            </div>
            <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
                <label style="font-size:0.55rem; font-weight:900; text-transform:uppercase; letter-spacing:0.15em; color:rgba(255,255,255,0.4);">Exit Date</label>
                <input type="date" id="input-exit" style="width:100%; background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.2); border-radius:10px; color:#fff; font-size:0.85rem; font-weight:800; padding:8px 10px; font-family:inherit; -webkit-appearance:none;">
            </div>
        </div>
        <div class="sheet-btn-row">
            <button onclick="closeAll()" class="brutalist-btn btn-half" style="background:rgba(255,255,255,0.1); color:#fff; border-color:rgba(255,255,255,0.3); box-shadow:none;">Cancel</button>
            <button onclick="saveEditTrip()" class="brutalist-btn" style="flex:1; height:60px; background:#2ED573; color:#000; border-color:#000; font-size:0.85rem;">Save</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="schengen-engine.js"></script>
    <script src="app.js"></script>

    <script>
        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

        let selectedTripId = null;
        let planningMode = false;
        let planStart = null;
        let planEnd = null;

        // ---- PLANNING MODE ----

        function enterPlanningMode() {
            planningMode = true;
            planStart = null;
            planEnd = null;
            document.getElementById('page-footer').style.display = 'none';
            document.getElementById('plan-footer').style.display = 'flex';
            document.getElementById('plan-status').innerText = 'Tap a start date';
            setSaveBtn(false);
            renderCalendar(window.allTrips);
        }

        function exitPlanningMode() {
            planningMode = false;
            planStart = null;
            planEnd = null;
            document.getElementById('page-footer').style.display = 'flex';
            document.getElementById('plan-footer').style.display = 'none';
            renderCalendar(window.allTrips);
        }

        function setSaveBtn(enabled) {
            const btn = document.getElementById('plan-save-btn');
            btn.disabled = !enabled;
            btn.style.opacity = enabled ? '1' : '0.3';
        }

        function onPlanningDayTap(dateStr) {
            if (!planStart) {
                // First tap — set start
                planStart = dateStr;
                planEnd = null;
                setSaveBtn(false);
                document.getElementById('plan-status').innerText = 'Now tap an end date';
                renderCalendar(window.allTrips);
            } else if (dateStr === planStart) {
                // Tapped same day — deselect
                planStart = null;
                planEnd = null;
                setSaveBtn(false);
                document.getElementById('plan-status').innerText = 'Tap a start date';
                renderCalendar(window.allTrips);
            } else if (dateStr < planStart) {
                // Tapped before start — reset and use as new start
                planStart = dateStr;
                planEnd = null;
                setSaveBtn(false);
                document.getElementById('plan-status').innerText = 'Now tap an end date';
                renderCalendar(window.allTrips);
            } else {
                // Second tap — check if valid end date
                const tempTrip = { entry: planStart, exit: dateStr };
                const status = SchengenEngine.calculateStatus([...window.allTrips, tempTrip], new Date(`${dateStr}T12:00:00`));
                if (status.remaining < 0) {
                    // Over limit — don't allow
                    return;
                }
                planEnd = dateStr;
                const d1 = planStart.split('-');
                const d2 = planEnd.split('-');
                const nights = daysBetween(new Date(`${planStart}T12:00:00`), new Date(`${planEnd}T12:00:00`));
                document.getElementById('plan-status').innerText = `${d1[2]}/${d1[1]} — ${d2[2]}/${d2[1]} · ${nights} night${nights !== 1 ? 's' : ''}`;
                setSaveBtn(true);
                renderCalendar(window.allTrips);
            }
        }

        function savePlanningTrip() {
            if (!planStart || !planEnd) return;
            window.db.ref('trips').push({ entry: planStart, exit: planEnd, timestamp: Date.now() });
            exitPlanningMode();
        }

        // ---- INFO STRIP ----

        function daysBetween(a, b) {
            return Math.round((b - a) / (1000 * 60 * 60 * 24));
        }

        function findEarliestReturn(trips) {
            const test = new Date(`${todayStr}T12:00:00`);
            for (let i = 0; i < 180; i++) {
                const status = SchengenEngine.calculateStatus(trips, test);
                if (status.remaining > 0) {
                    return `${test.getFullYear()}-${String(test.getMonth()+1).padStart(2,'0')}-${String(test.getDate()).padStart(2,'0')}`;
                }
                test.setDate(test.getDate() + 1);
            }
            return null;
        }

        function updateInfoStrip(trips) {
            const res = SchengenEngine.calculateStatus(trips);
            const remEl = document.getElementById('info-remaining');
            if (remEl) {
                remEl.innerText = res.remaining;
                remEl.style.color = res.remaining >= 50 ? '#2ED573' : res.remaining >= 20 ? '#f97316' : '#ef4444';
            }

            const today = new Date(`${todayStr}T12:00:00`);
            const sorted = [...trips].sort((a, b) => new Date(a.entry) - new Date(b.entry));
            const currentTrip = sorted.find(t => todayStr >= t.entry && todayStr <= t.exit);
            const nextTrip = sorted.find(t => t.entry > todayStr);
            const labelEl = document.getElementById('info-status-label');
            const valueEl = document.getElementById('info-status-value');

            if (currentTrip) {
                const exitDate = new Date(`${currentTrip.exit}T12:00:00`);
                const days = daysBetween(today, exitDate);
                labelEl.innerText = 'Days Left in Spain';
                valueEl.innerText = days === 0 ? 'Last day!' : `${days} day${days !== 1 ? 's' : ''}`;
                valueEl.style.color = '#2ED573';
            } else if (res.remaining === 0) {
                const earliest = findEarliestReturn(trips);
                if (earliest) {
                    const d = earliest.split('-');
                    labelEl.innerText = 'Earliest Return';
                    valueEl.innerText = `${d[2]}/${d[1]}/${d[0]}`;
                    valueEl.style.color = '#ef4444';
                }
            } else if (nextTrip) {
                const entryDate = new Date(`${nextTrip.entry}T12:00:00`);
                const days = daysBetween(today, entryDate);
                labelEl.innerText = 'Next Trip';
                valueEl.innerText = days === 0 ? 'Today!' : `${days} day${days !== 1 ? 's' : ''}`;
                valueEl.style.color = '#00A8FF';
            } else {
                labelEl.innerText = 'Can Travel';
                valueEl.innerText = 'Any time!';
                valueEl.style.color = '#2ED573';
            }
        }

        // ---- CALENDAR RENDER ----

        function getPlanningClass(dateStr) {
            // Is this day part of an existing trip? Lock it.
            const existingTrip = window.allTrips.find(t => dateStr >= t.entry && dateStr <= t.exit);
            if (existingTrip) return 'plan-locked';

            if (!planStart) {
                // No start selected yet — all free days are tappable
                return 'plan-blank';
            }

            if (dateStr === planStart) return 'plan-selected';

            if (planEnd && dateStr > planStart && dateStr <= planEnd) return 'plan-range';

            if (dateStr < planStart) return 'plan-blank';

            // dateStr is after planStart — check if adding this as exit would be legal
            const tempTrip = { entry: planStart, exit: dateStr };
            const status = SchengenEngine.calculateStatus([...window.allTrips, tempTrip], new Date(`${dateStr}T12:00:00`));
            return status.remaining >= 0 ? 'plan-green' : 'plan-red';
        }

        function renderCalendar(trips) {
            const container = document.getElementById('calendar-container');
            container.innerHTML = '';
            const DAY_HEADERS = ['Su','Mo','Tu','We','Th','Fr','Sa'];

            for (let offset = -6; offset <= 12; offset++) {
                const monthDate = new Date(now.getFullYear(), now.getMonth() + offset, 1);
                const year = monthDate.getFullYear();
                const month = monthDate.getMonth();
                const monthName = monthDate.toLocaleString('default', { month: 'long' });

                const block = document.createElement('div');
                block.className = 'month-block';
                if (offset === 0) block.id = 'current-month';

                const label = document.createElement('div');
                label.className = 'month-label';
                label.innerText = `${monthName} ${year}`;
                block.appendChild(label);

                const grid = document.createElement('div');
                grid.className = 'day-grid';

                DAY_HEADERS.forEach(h => {
                    const hEl = document.createElement('div');
                    hEl.className = 'day-header';
                    hEl.innerText = h;
                    grid.appendChild(hEl);
                });

                const firstDay = new Date(year, month, 1).getDay();
                for (let i = 0; i < firstDay; i++) {
                    const empty = document.createElement('div');
                    empty.className = 'day-cell day-empty';
                    grid.appendChild(empty);
                }

                const daysInMonth = new Date(year, month + 1, 0).getDate();
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const cell = document.createElement('div');

                    if (planningMode) {
                        const cls = getPlanningClass(dateStr);
                        cell.className = `day-cell ${cls}`;
                        cell.innerText = d;
                        if (cls !== 'plan-locked' && cls !== 'plan-red') {
                            cell.onclick = () => onPlanningDayTap(dateStr);
                        }
                    } else {
                        const tripOnDay = trips.find(t => dateStr >= t.entry && dateStr <= t.exit);
                        let cls = 'day-blank';
                        if (tripOnDay) {
                            if (dateStr < todayStr) cls = 'day-past';
                            else if (dateStr === todayStr) cls = 'day-current';
                            else cls = 'day-future';
                        }
                        if (dateStr === todayStr) cls += ' day-today';
                        cell.className = `day-cell ${cls}`;
                        cell.innerText = d;
                        if (tripOnDay) cell.onclick = () => openActionSheet(tripOnDay);
                    }

                    grid.appendChild(cell);
                }

                block.appendChild(grid);
                container.appendChild(block);
            }

            if (!planningMode) {
                setTimeout(() => {
                    const cur = document.getElementById('current-month');
                    if (cur) cur.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 300);
            }
        }

        // ---- ACTION SHEET ----

        function openActionSheet(trip) {
            selectedTripId = trip.id;
            const d1 = trip.entry.split('-');
            const d2 = trip.exit.split('-');
            document.getElementById('action-sheet-title').innerText =
                `${d1[2]}.${d1[1]}.${d1[0]} — ${d2[2]}.${d2[1]}.${d2[0]}`;
            document.getElementById('overlay-backdrop').style.display = 'block';
            document.getElementById('action-sheet').style.display = 'block';
        }

        function deleteSelectedTrip() {
            if (!selectedTripId) return;
            if (confirm("Permanently delete this trip?")) {
                window.db.ref('trips').child(selectedTripId).remove();
                closeAll();
            }
        }

        function editSelectedTrip() {
            const trip = window.allTrips.find(t => t.id === selectedTripId);
            if (!trip) return;
            document.getElementById('action-sheet').style.display = 'none';
            document.getElementById('add-sheet-title').innerText = 'Edit Trip';
            document.getElementById('input-entry').value = trip.entry;
            document.getElementById('input-exit').value = trip.exit;
            document.getElementById('add-sheet').style.display = 'block';
        }

        function saveEditTrip() {
            const entry = document.getElementById('input-entry').value;
            const exit = document.getElementById('input-exit').value;
            if (!entry || !exit) { alert('Please set both dates.'); return; }
            if (exit < entry) { alert('Exit must be after entry.'); return; }
            window.db.ref('trips').child(selectedTripId).update({ entry, exit });
            closeAll();
        }

        function closeAll() {
            document.getElementById('overlay-backdrop').style.display = 'none';
            document.getElementById('action-sheet').style.display = 'none';
            document.getElementById('add-sheet').style.display = 'none';
            selectedTripId = null;
        }

        // ---- DATA ----
        window.addEventListener('tripsUpdated', () => {
            updateInfoStrip(window.allTrips);
            renderCalendar(window.allTrips);
        });
    </script>
</body>
</html>
