<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Add Trip</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body class="bg-home text-white">

    <div class="w-full flex justify-between items-center pt-10">
        <h1 class="text-2xl font-black">Select Dates</h1>
        <a href="log.html" class="text-xs font-bold uppercase opacity-50">Cancel</a>
    </div>

    <div class="flex-grow flex items-center justify-center w-full overflow-hidden">
        <div id="diary-widget"></div>
    </div>

    <div class="w-full max-w-sm pb-10">
        <button onclick="saveTrip()" id="add-btn" class="w-full py-6 bg-green-500 text-white font-black rounded-3xl shadow-2xl opacity-20 transition-all uppercase tracking-widest" disabled>
            Save This Trip
        </button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
    <script>
        const successSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3');
        let selectedDates = [];

        flatpickr("#diary-widget", {
            mode: "range", inline: true, monthSelectorType: "static",
            dateFormat: "d/m/Y",
            onChange: function(dates) {
                selectedDates = dates;
                const btn = document.getElementById('add-btn');
                btn.disabled = dates.length !== 2;
                btn.classList.toggle('opacity-20', dates.length !== 2);
            }
        });

        function saveTrip() {
            if (selectedDates.length === 2 && window.db) {
                successSound.play();
                const entry = flatpickr.formatDate(selectedDates[0], "Y-m-d");
                const exit = flatpickr.formatDate(selectedDates[1], "Y-m-d");
                window.db.ref('trips').push({ entry, exit }).then(() => {
                    setTimeout(() => { window.location.href = "log.html"; }, 400);
                });
            }
        }
    </script>
</body>
</html>
