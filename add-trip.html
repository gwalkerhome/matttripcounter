<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Select Dates</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    
    <style>
        /* 1. Ensure the container can actually be seen */
        #calendar-holder {
            display: block !important;
            min-height: 300px; /* Forces the 'window' to stay open */
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }

        /* 2. The Calendar Widget */
        .flatpickr-calendar { 
            background: rgba(15, 23, 42, 0.98) !important; 
            border: 1px solid rgba(255,255,255,0.3) !important;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5) !important;
            border-radius: 1.5rem !important;
            width: 300px !important; /* Fixed width for 7-day stability */
        }

        /* 3. The 'Window' - Opening it wide enough for 7 days */
        .flatpickr-innerContainer, .flatpickr-rContainer, .dayContainer, .flatpickr-days {
            width: 300px !important;
            min-width: 300px !important;
            max-width: 300px !important;
        }

        /* 4. Cell Sizing - Small enough to fit, large enough to tap */
        .flatpickr-day {
            width: 38px !important;
            height: 38px !important;
            line-height: 38px !important;
            margin: 2px !important;
            font-size: 1rem !important;
            font-weight: 600 !important;
            border-radius: 10px !important;
            color: white !important;
            flex-basis: 38px !important;
        }

        /* 5. Header / Navigation */
        .flatpickr-current-month {
            font-size: 1.1rem !important;
            font-weight: 800 !important;
            padding: 5px 0 !important;
        }

        .flatpickr-weekday {
            width: 42px !important; /* Space for the day labels (S, M, T...) */
            font-size: 0.8rem !important;
            color: rgba(255,255,255,0.5) !important;
        }

        /* 6. Colors */
        .flatpickr-day.selected, .flatpickr-day.startRange, .flatpickr-day.endRange {
            background: #fb923c !important;
            border-color: #fb923c !important;
        }

        .flatpickr-day.inRange {
            background: rgba(251, 146, 60, 0.2) !important;
            box-shadow: -5px 0 0 rgba(251, 146, 60, 0.2), 5px 0 0 rgba(251, 146, 60, 0.2) !important;
        }
    </style>
</head>
<body class="bg-home min-h-screen flex flex-col items-center p-6 text-white">

    <div class="w-full max-w-md flex justify-between items-center mb-8 mt-4">
        <h1 class="text-3xl font-black tracking-tight" style="text-shadow: 0 4px 10px rgba(0,0,0,0.5);">Select Dates</h1>
        <a href="log.html" class="glass-button px-4 py-2 text-sm font-bold">Cancel</a>
    </div>

    <div id="calendar-holder" class="mb-8"></div>
    
    <div class="w-full max-w-[300px]">
        <button onclick="saveTrip()" id="add-btn" class="w-full py-5 bg-green-500 text-white font-black rounded-2xl shadow-xl transition-all opacity-20 cursor-not-allowed" disabled>
            SAVE THIS TRIP
        </button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB5l2JrkNaHqpg3KBCwyDW3UTBlv1QSrZo",
            authDomain: "matttrip-56a17.firebaseapp.com",
            projectId: "matttrip-56a17",
            databaseURL: "https://matttrip-56a17-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let selectedDates = [];

        // Attach the calendar directly to the #calendar-holder div
        const fp = flatpickr("#calendar-holder", {
            mode: "range",
            inline: true,
            dateFormat: "Y-m-d",
            monthSelectorType: "static",
            onChange: function(dates) {
                selectedDates = dates;
                const btn = document.getElementById('add-btn');
                if (dates.length === 2) {
                    btn.disabled = false;
                    btn.classList.remove('opacity-20', 'cursor-not-allowed');
                } else {
                    btn.disabled = true;
                    btn.classList.add('opacity-20', 'cursor-not-allowed');
                }
            }
        });

        function saveTrip() {
            if (selectedDates.length === 2) {
                // Ensure we save the date precisely as selected
                const entry = formatDate(selectedDates[0]);
                const exit = formatDate(selectedDates[1]);
                db.ref('trips').push({ entry, exit }).then(() => {
                    window.location.href = "log.html";
                });
            }
        }

        function formatDate(date) {
            const d = new Date(date);
            const month = (d.getMonth() + 1).toString().padStart(2, '0');
            const day = d.getDate().toString().padStart(2, '0');
            return `${d.getFullYear()}-${month}-${day}`;
        }
    </script>
</body>
</html>
