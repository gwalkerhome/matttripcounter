<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">
    <title>Add Trip</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="main-body" class="min-h-screen flex flex-col items-center p-6 text-white bg-black">

    <div class="w-full max-w-md flex justify-between items-center mb-10 mt-4">
        <h1 class="text-2xl font-black italic tracking-tighter">NEW TRIP</h1>
        <a href="log.html" class="glass-button px-4 py-2 text-xs font-bold uppercase">Cancel</a>
    </div>

    <div class="w-full max-w-md space-y-6">
        <div class="glass-card p-6 rounded-[2rem]">
            <label class="block text-[10px] font-black uppercase tracking-[0.2em] opacity-40 mb-2">Entry Date</label>
            <input type="date" id="entry" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white focus:outline-none focus:border-orange-500">
        </div>

        <div class="glass-card p-6 rounded-[2rem]">
            <label class="block text-[10px] font-black uppercase tracking-[0.2em] opacity-40 mb-2">Exit Date</label>
            <input type="date" id="exit" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white focus:outline-none focus:border-orange-500">
        </div>

        <button onclick="saveTrip()" class="w-full py-5 bg-white text-black font-black rounded-[2rem] shadow-xl uppercase tracking-widest active:scale-95 transition-transform mt-8">
            Save to Log
        </button>
    </div>

    <!-- Firebase & Master Logic -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>

    <script>
        function saveTrip() {
            const entry = document.getElementById('entry').value;
            const exit = document.getElementById('exit').value;

            if (!entry || !exit) {
                alert("Please select both dates.");
                return;
            }

            if (new Date(exit) < new Date(entry)) {
                alert("Exit date cannot be before entry date.");
                return;
            }

            // Using window.db provided by app.js
            if (window.db) {
                window.db.ref('trips').push({
                    entry: entry,
                    exit: exit,
                    timestamp: Date.now()
                }).then(() => {
                    window.location.href = 'log.html';
                }).catch(err => {
                    alert("Error saving: " + err.message);
                });
            } else {
                alert("Database connection not ready. Try again.");
            }
        }
    </script>
</body>
</html>
