<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Select Dates</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.npmcdn.com/flatpickr/dist/flatpickr.min.js"></script>
    
    <style>
        /* 1. The Wrapper - Remove padding to give the calendar every pixel possible */
        #calendar-holder {
            width: 100% !important;
            display: flex;
            justify-content: center;
            padding: 0 !important;
            margin-top: 10px;
        }

        /* 2. The Window - Open it wide and remove internal padding */
        .flatpickr-calendar { 
            background: rgba(15, 23, 42, 0.98) !important; 
            border: 1px solid rgba(255,255,255,0.3) !important;
            width: 280px !important; /* Total width: (35px + 4px margin) * 7 = 273px */
            min-width: 280px !important;
            max-width: 280px !important;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5) !important;
            border-radius: 1.2rem !important;
            overflow: hidden !important;
        }

        /* 3. Force the internal containers to stay 7-days wide */
        .flatpickr-innerContainer, .flatpickr-rContainer, .flatpickr-days, .dayContainer {
            width: 280px !important;
            min-width: 280px !important;
            max-width: 280px !important;
        }

        /* 4. The Cells - Reduce size so 7 fit across easily */
        .flatpickr-day {
            width: 35px !important;
            height: 35px !important;
            line-height: 35px !important;
            margin: 2px !important;
            font-size: 0.9rem !important; /* Slightly smaller font */
            font-weight: 600 !important;
            border-radius: 8px !important;
            color: white !important;
            flex-basis: 35px !important; /* Ensures the flexbox respects the size */
        }

        /* 5. Header Adjustments */
        .flatpickr-current-month {
            font-size: 1rem !important;
            font-weight: 700 !important;
            padding: 0 !important;
            top: 5px !important;
        }
        
        .flatpickr-month { height: 40px !important; }

        .flatpickr-weekday {
            width: 40px !important; /* Matching cell spacing */
            font-size: 0.75rem !important;
            color: rgba(255,255,255,0.5) !important;
        }

        /* 6. Active States */
        .flatpickr-day.selected, .flatpickr-day.startRange, .flatpickr-day.endRange {
            background: #fb923c !important;
            border-color: #fb923c !important;
        }

        .flatpickr-day.inRange {
            background: rgba(251, 146, 60, 0.2) !important;
            box-shadow: -3px 0 0 rgba(251, 146, 60, 0.2), 3px 0 0 rgba(251, 146, 60, 0.2) !important;
        }
    </style>
</head>
<body class="bg-home min-h-screen flex flex-col items-center p-4 text-white">

    <div class="w-full max-w-md flex justify-between items-center mb-4 mt-2">
        <h1 class="text-2xl font-black tracking-tight" style="text-shadow: 0 4px 10px rgba(0,0,0,0.5);">Select Dates</h1>
        <a href="log.html" class="glass-button px-4 py-2 text-sm font-bold">Cancel</a>
    </div>

    <div class="w-full flex flex-col items-center">
        <div id="calendar-holder" class="mb-6"></div>
        
        <button onclick="saveTrip()" id="add-btn" class="w-full max-w-[280px] py-4 bg-green-500 text-white font-black rounded-xl shadow-xl transition-all opacity-20 cursor-not-allowed" disabled>
            SAVE THIS TRIP
        </button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB5l2JrkNaHqpg3KBCwyDW3UTBlv1QSrZo",
            authDomain: "matttrip-56a17.firebaseapp.com",
            projectId: "matttrip-56a17",
            databaseURL: "https://matttrip-56a17-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let selectedDates = [];

        const fp = flatpickr("#calendar-holder", {
            mode: "range",
            inline: true,
            dateFormat: "Y-m-d",
            monthSelectorType: "static",
            onChange: function(dates) {
                selectedDates = dates;
                const btn = document.getElementById('add-btn');
                if (dates.length === 2) {
                    btn.disabled = false;
                    btn.classList.remove('opacity-20', 'cursor-not-allowed');
                } else {
                    btn.disabled = true;
                    btn.classList.add('opacity-20', 'cursor-not-allowed');
                }
            }
        });

        function saveTrip() {
            if (selectedDates.length === 2) {
                const entry = formatDateStorage(selectedDates[0]);
                const exit = formatDateStorage(selectedDates[1]);
                db.ref('trips').push({ entry, exit }).then(() => {
                    window.location.href = "log.html";
                });
            }
        }

        function formatDateStorage(date) {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1);
            let day = '' + d.getDate();
            let year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        }
    </script>
</body>
</html>
