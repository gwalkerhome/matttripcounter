<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Select Dates</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    
    <style>
        /* 1. The Outer Container */
        #calendar-holder {
            width: 100% !important;
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        /* 2. The Widget Itself - Hard width to force 7 columns */
        .flatpickr-calendar { 
            background: rgba(15, 23, 42, 0.98) !important; 
            border: 1px solid rgba(255,255,255,0.3) !important;
            width: 315px !important; 
            min-width: 315px !important;
            font-family: inherit !important;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5) !important;
            border-radius: 1.5rem !important;
            display: block !important;
        }

        /* 3. The Grid Containers */
        .flatpickr-innerContainer, .flatpickr-rContainer, .flatpickr-days {
            width: 315px !important;
            min-width: 315px !important;
        }

        /* 4. Individual Day Cells - Sized to fit 7 across */
        .flatpickr-day {
            width: 40px !important;
            height: 40px !important;
            line-height: 40px !important;
            margin: 2px !important;
            font-size: 1rem !important;
            font-weight: 600 !important;
            border-radius: 10px !important;
            color: white !important;
        }

        /* 5. Header / Month Logic */
        .flatpickr-current-month {
            font-size: 1.1rem !important;
            font-weight: 800 !important;
            width: 100% !important;
            left: 0 !important;
            padding: 0 !important;
        }

        .flatpickr-month {
            height: 50px !important;
            padding-top: 10px !important;
        }

        .flatpickr-prev-month, .flatpickr-next-month {
            padding: 15px !important;
        }

        /* 6. Selected/Range Highlights */
        .flatpickr-day.selected, .flatpickr-day.startRange, .flatpickr-day.endRange {
            background: #fb923c !important;
            border-color: #fb923c !important;
            color: white !important;
        }

        .flatpickr-day.inRange {
            background: rgba(251, 146, 60, 0.2) !important;
            border-color: transparent !important;
            box-shadow: -5px 0 0 rgba(251, 146, 60, 0.2), 5px 0 0 rgba(251, 146, 60, 0.2) !important;
        }

        /* Ensure day names (S, M, T...) are visible */
        .flatpickr-weekday {
            color: rgba(255,255,255,0.6) !important;
            font-weight: bold !important;
        }
    </style>
</head>
<body class="bg-home min-h-screen flex flex-col items-center p-6 text-white">

    <div class="w-full max-w-md flex justify-between items-center mb-6 mt-4">
        <h1 class="text-3xl font-black tracking-tight" style="text-shadow: 0 4px 10px rgba(0,0,0,0.5);">Select Dates</h1>
        <a href="log.html" class="glass-button px-4 py-2 text-sm font-bold">Cancel</a>
    </div>

    <div class="w-full max-w-md flex flex-col items-center">
        <div id="calendar-holder" class="mb-8"></div>
        
        <button onclick="saveTrip()" id="add-btn" class="w-full py-5 bg-green-500 text-white font-black rounded-2xl shadow-xl transition-all opacity-20 cursor-not-allowed" disabled>
            SAVE THIS TRIP
        </button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    
    <script>
        // Use the same config as your other pages
        const firebaseConfig = {
            apiKey: "AIzaSyB5l2JrkNaHqpg3KBCwyDW3UTBlv1QSrZo",
            authDomain: "matttrip-56a17.firebaseapp.com",
            projectId: "matttrip-56a17",
            databaseURL: "https://matttrip-56a17-default-rtdb.europe-west1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let selectedDates = [];

        // Initialize the inline diary widget
        const fp = flatpickr("#calendar-holder", {
            mode: "range",
            inline: true,
            dateFormat: "Y-m-d",
            monthSelectorType: "static",
            animate: true,
            onChange: function(dates) {
                selectedDates = dates;
                const btn = document.getElementById('add-btn');
                if (dates.length === 2) {
                    btn.disabled = false;
                    btn.classList.remove('opacity-20', 'cursor-not-allowed');
                } else {
                    btn.disabled = true;
                    btn.classList.add('opacity-20', 'cursor-not-allowed');
                }
            }
        });

        // Save logic with local date formatting to prevent day-shifting
        function saveTrip() {
            if (selectedDates.length === 2) {
                const entry = formatDateStorage(selectedDates[0]);
                const exit = formatDateStorage(selectedDates[1]);
                
                db.ref('trips').push({ entry, exit }).then(() => {
                    window.location.href = "log.html";
                });
            }
        }

        function formatDateStorage(date) {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1);
            let day = '' + d.getDate();
            let year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        }
    </script>
</body>
</html>
