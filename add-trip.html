<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Select Dates</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        .calendar-wrapper { display: flex; justify-content: center; width: 100%; padding: 10px 0; }
        .flatpickr-calendar { transform: scale(0.95); transform-origin: top; background: #1a1a1a !important; border-radius: 1.5rem !important; }
    </style>
</head>
<body class="bg-home min-h-screen flex flex-col items-center p-6 text-white">
    <div class="w-full max-w-md flex justify-between items-center mb-6 mt-4">
        <h1 class="text-3xl font-black">Select Dates</h1>
        <a href="log.html" class="glass-button px-4 py-2 text-sm font-bold">CANCEL</a>
    </div>
    <div class="calendar-wrapper"><div id="diary-widget"></div></div>
    <div class="w-full max-w-xs mt-4">
        <button onclick="saveTrip()" id="add-btn" class="w-full py-5 bg-green-500 text-white font-black rounded-2xl shadow-xl opacity-20 transition-all" disabled>SAVE THIS TRIP</button>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
    <script>
        const successSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3');
        let selectedDates = [];
        flatpickr("#diary-widget", {
            mode: "range", inline: true, monthSelectorType: "static",
            onChange: function(dates) {
                selectedDates = dates;
                const btn = document.getElementById('add-btn');
                btn.disabled = dates.length !== 2;
                btn.classList.toggle('opacity-20', dates.length !== 2);
            }
        });
        function saveTrip() {
    if (selectedDates.length === 2 && window.db) {
        successSound.play();
        
        // We take the clean Y-m-d string from Flatpickr 
        // and append T12:00:00 to lock it into the middle of the day.
        const entry = flatpickr.formatDate(selectedDates[0], "Y-m-d");
        const exit = flatpickr.formatDate(selectedDates[1], "Y-m-d");
        
        window.db.ref('trips').push({ 
            entry: entry, 
            exit: exit,
            timestamp: new Date().getTime() // Optional: helps with sorting
        }).then(() => {
            setTimeout(() => { window.location.href = "log.html"; }, 400);
        });
    }
}

    </script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

<!-- The Brains (Order matters!) -->
<script src="schengen-engine.js"></script> 
<script src="app.js"></script>

    
</body>
</html>
