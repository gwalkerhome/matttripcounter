<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Plan Ahead</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="main-body" class="min-h-screen flex flex-col items-center py-6 px-6 text-white overflow-hidden">

    <!-- Header - Reduced Margins -->
    <div class="w-full max-w-md flex justify-between items-center mb-4">
        <h1 class="text-2xl font-black italic tracking-tighter uppercase">Strategy</h1>
        <a href="index.html" class="glass-button px-4 py-1.5 text-[9px] font-black uppercase tracking-widest">Done</a>
    </div>

    <div class="w-full max-w-md flex flex-col space-y-3">
        
        <!-- Today's Status Header - More Compact -->
        <div class="glass-button p-5 rounded-[1.5rem] w-full bg-black/40 border-b border-white/10">
            <p class="text-[9px] uppercase tracking-[0.2em] opacity-50 font-black mb-0.5">Baseline Available Today</p>
            <div id="plan-days" class="text-6xl font-black tracking-tighter leading-none">--</div>
            <p id="baseline-status" class="text-[9px] opacity-40 uppercase tracking-widest mt-1 font-bold italic">Syncing...</p>
        </div>

        <!-- Navigation Options - Reduced Padding & Font Sizes -->
        <div class="grid grid-cols-1 gap-2.5">
            
            <!-- 1. Manual Entry -->
            <a href="plan-manual.html" class="glass-button py-3.5 px-5 flex items-center justify-between group active:scale-95 transition-transform">
                <div class="text-left">
                    <p class="font-black text-base leading-tight uppercase tracking-tight">Manual Check</p>
                    <p class="text-[9px] opacity-50 font-bold uppercase tracking-wider italic">Test future dates</p>
                </div>
                <svg class="w-4 h-4 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/></svg>
            </a>

            <!-- 2. Suggestion -->
            <a href="plan-suggest.html" class="glass-button py-3.5 px-5 flex items-center justify-between border-l-4 border-orange-500 group active:scale-95 transition-transform bg-orange-500/5">
                <div class="text-left">
                    <p class="font-black text-base leading-tight uppercase tracking-tight text-orange-400">Earliest Return</p>
                    <p class="text-[9px] opacity-60 font-bold uppercase tracking-wider">When can I go back?</p>
                </div>
                <svg class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </a>

            <!-- 3. How Long? -->
            <a href="plan-max.html" class="glass-button py-3.5 px-5 flex items-center justify-between group active:scale-95 transition-transform">
                <div class="text-left">
                    <p class="font-black text-base leading-tight uppercase tracking-tight">Max Stay</p>
                    <p class="text-[9px] opacity-50 font-bold uppercase tracking-wider italic">Find my legal exit</p>
                </div>
                <svg class="w-4 h-4 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            </a>

            <!-- 4. AI Strategic - Distinctive but Compact -->
            <a href="ai-planner.html" class="glass-button py-4 px-5 bg-orange-500/20 border border-orange-500/30 active:scale-95 transition-transform">
                <div class="text-left flex justify-between items-center w-full">
                    <div>
                        <p class="font-black text-base leading-tight text-orange-400 uppercase tracking-tighter">Plan with AI</p>
                        <p class="text-[9px] text-orange-200/60 font-bold uppercase tracking-widest">Strategic scenario mapping</p>
                    </div>
                    <div class="bg-orange-500 p-1.5 rounded-lg">
                        <svg class="w-4 h-4 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L14.5 9H22L16 14L18.5 21L12 17L5.5 21L8 14L2 9H9.5L12 2Z"/></svg>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <!-- Core Dependencies -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="schengen-engine.js"></script>
    <script src="app.js"></script>

    <script>
        // Use the CENTRALIZED app logic to prevent "84 vs 53" math bugs
        function syncBaseline() {
            if (window.db) {
                window.db.ref('trips').on('value', snap => {
                    const trips = [];
                    snap.forEach(c => {
                        const val = c.val();
                        if(val.entry && val.exit) trips.push(val);
                    });
                    
                    // We pull the same calculation the Index uses for 100% consistency
                    const status = SchengenEngine.calculateStatus(trips);
                    
                    const daysEl = document.getElementById('plan-days');
                    const statusEl = document.getElementById('baseline-status');
                    
                    if (daysEl) {
                        daysEl.innerText = status.remaining;
                        // Visual feedback if limit is close
                        daysEl.className = status.remaining < 10 
                            ? "text-6xl font-black tracking-tighter leading-none text-orange-500" 
                            : "text-6xl font-black tracking-tighter leading-none text-white";
                    }
                    if (statusEl) statusEl.innerText = "Current verified allowance";
                });
            }
        }
        // Initialize
        setTimeout(syncBaseline, 300);
    </script>
</body>
</html>
